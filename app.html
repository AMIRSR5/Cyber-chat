<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Cyber Chat — Design tokens
   Palette: deep signal-blue base, cyan/magenta dual accent
   Type: Vazirmatn (Persian UI) + JetBrains Mono (labels/brand)
   Signature: "signal ring" pulse on presence + scanline hero
   ============================================================ */

:root {
  --bg-deep: #0E1621;
  --bg-panel: #17212B;
  --bg-elevated: #1F2C38;
  --border-soft: #232E3C;

  --cyan: #2AABEE;
  --magenta: #229ED9;
  --success: #4DCD5E;
  --danger: #EB5545;

  --own-bubble: #2B5278;
  --other-bubble: #182533;

  --text-primary: #FFFFFF;
  --text-dim: #8A9BA8;
  --text-faint: #6C7883;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;

  --shadow-glow: 0 0 24px rgba(42, 171, 238, 0.18);
}

/* Light mode overrides (Telegram light theme) */
[data-theme="light"] {
  --bg-deep: #FFFFFF;
  --bg-panel: #FFFFFF;
  --bg-elevated: #F4F4F5;
  --border-soft: #E4E4E6;
  --text-primary: #000000;
  --text-dim: #707579;
  --text-faint: #A2ACB4;
  --own-bubble: #EAF4FE;
  --other-bubble: #F4F4F5;
  --shadow-glow: 0 0 24px rgba(42, 171, 238, 0.10);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: "Vazirmatn", -apple-system, sans-serif;
  direction: rtl;
}

.mono {
  font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.02em;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

::selection { background: var(--cyan); color: #ffffff; }

/* ---------- scrollbar ---------- */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   Landing page
   ============================================================ */

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 6vw;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(12px);
  background: rgba(9, 12, 17, 0.7);
  border-bottom: 1px solid var(--border-soft);
}
[data-theme="light"] .nav { background: rgba(244, 246, 250, 0.8); }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "JetBrains Mono", monospace;
  font-weight: 700;
  font-size: 18px;
}
.brand-mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #ffffff; font-weight: 900;
  box-shadow: var(--shadow-glow);
}

.nav-actions { display: flex; gap: 10px; }

.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  transition: all .15s ease;
}
.btn:hover { border-color: var(--cyan); }
.btn-primary {
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  color: #ffffff;
  border: none;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { border: none; color: var(--text-dim); }
.btn-block { width: 100%; padding: 13px; font-size: 15px; }

.hero {
  position: relative;
  padding: 90px 6vw 60px;
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: -20% -10% auto -10%;
  height: 480px;
  background:
    repeating-linear-gradient(180deg, rgba(0,229,255,.05) 0 1px, transparent 1px 3px);
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-family: "JetBrains Mono", monospace;
  color: var(--cyan);
  font-size: 13px;
  letter-spacing: 0.15em;
  margin-bottom: 18px;
}
.hero h1 {
  font-size: clamp(32px, 6vw, 64px);
  line-height: 1.15;
  margin: 0 0 20px;
  font-weight: 800;
}
.hero h1 .grad {
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p {
  max-width: 560px;
  margin: 0 auto 34px;
  color: var(--text-dim);
  font-size: 17px;
  line-height: 1.8;
}
.hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.section { padding: 70px 6vw; }
.section-title {
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 10px;
}
.section-sub {
  text-align: center;
  color: var(--text-dim);
  margin-bottom: 44px;
  font-size: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px;
  max-width: 1100px;
  margin: 0 auto;
}
.card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 24px;
  transition: border-color .15s ease, transform .15s ease;
}
.card:hover { border-color: var(--cyan); transform: translateY(-2px); }
.card-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,229,255,.1);
  color: var(--cyan);
  margin-bottom: 14px;
  font-size: 18px;
}
.card h3 { margin: 0 0 8px; font-size: 16px; }
.card p { margin: 0; color: var(--text-dim); font-size: 13.5px; line-height: 1.7; }

.premium-band {
  background: linear-gradient(135deg, rgba(255,45,149,.12), rgba(0,229,255,.08));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 46px 6vw;
  text-align: center;
  max-width: 1100px;
  margin: 0 auto;
}
.badge {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--magenta);
  color: var(--magenta);
  margin-bottom: 16px;
}

.footer {
  border-top: 1px solid var(--border-soft);
  padding: 30px 6vw;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
}

/* ============================================================
   Auth pages
   ============================================================ */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 34px 28px;
  box-shadow: var(--shadow-glow);
}
.auth-tabs {
  display: flex;
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1;
  text-align: center;
  padding: 9px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
}
.auth-tab.active { background: var(--cyan); color: #ffffff; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 16px;
  outline: none;
  transition: border-color .15s ease;
}
.field input:focus { border-color: var(--cyan); }

.form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 13px; color: var(--text-dim); }
.form-row label { display: flex; align-items: center; gap: 6px; }

.auth-msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
.auth-msg.error { color: var(--danger); }
.auth-msg.success { color: var(--success); }

/* ============================================================
   Messenger app shell
   ============================================================ */
.app-shell {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-height, 100vh));
  overflow: hidden;
}
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  /* Mobile is a screen-stack: list is the home screen, chat is pushed on top. */
  .sidebar { position: fixed; inset: 0; width: 100%; max-width: none; z-index: 20; transform: none; }
  .sidebar.chat-open { transform: translateX(100%); transition: transform .2s ease; }
  .chat-main { position: fixed; inset: 0; z-index: 25; transform: translateX(100%); transition: transform .2s ease; }
  .chat-main.active { transform: translateX(0); }
  .sidebar-backdrop { display: none !important; }
}

@media (min-width: 861px) {
  .bottom-nav { display: none; }
  .fab { bottom: 20px; }
}

.sidebar {
  background: var(--bg-panel);
  border-left: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  position: relative;
}
.fab {
  position: absolute;
  bottom: 92px;
  left: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  color: #fff; font-size: 22px; border: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
  z-index: 10;
}
.bottom-nav {
  position: absolute;
  bottom: 10px; left: 12px; right: 12px;
  display: flex;
  border-radius: 22px;
  background: rgba(23, 33, 43, 0.68);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
  z-index: 9;
}
[data-theme="light"] .bottom-nav {
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.bottom-nav-item {
  flex: 1; background: none; border: none; padding: 9px 0 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-faint); font-size: 11px; font-family: inherit;
}
.bottom-nav-item.active { color: var(--cyan); }
.chat-list { padding-bottom: 76px; }
.bottom-nav-icon { font-size: 20px; }
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--border-soft);
}
.sidebar-search { padding: 12px 16px; }
.sidebar-search input {
  width: 100%; padding: 10px 14px; border-radius: 999px;
  border: 1px solid var(--border-soft); background: var(--bg-deep);
  color: var(--text-primary); font-size: 13.5px; outline: none;
}
.sidebar-tabs { display: flex; gap: 4px; padding: 0 12px 10px; }
.sidebar-tab {
  padding: 7px 12px; border-radius: 999px; font-size: 12.5px;
  color: var(--text-dim); border: 1px solid transparent;
}
.sidebar-tab.active { background: var(--bg-elevated); color: var(--cyan); border-color: var(--border-soft); }

.chat-list { flex: 1; overflow-y: auto; }
.chat-row-wrap { position: relative; overflow: hidden; }
.chat-row-actions {
  position: absolute; inset: 0; display: flex; justify-content: flex-end; align-items: stretch;
}
.chat-row-actions button {
  width: 70px; border: none; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
}
.chat-row-actions .mute-btn { background: #ffc107; }
.chat-row-actions .delete-btn { background: var(--danger); }
.chat-item {
  display: flex; gap: 13px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--border-soft);
  transition: transform .15s ease;
  background: var(--bg-panel);
  position: relative; z-index: 1;
}
.chat-item:hover { background: var(--bg-elevated); }
.stories-bar { display: flex; gap: 14px; padding: 12px 16px; overflow-x: auto; border-bottom: 1px solid var(--border-soft); }
.story-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; width: 60px; }
.story-ring {
  width: 56px; height: 56px; border-radius: 50%; padding: 2px;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  display: flex; align-items: center; justify-content: center;
}
.story-ring.seen { background: var(--border-soft); }
.story-ring .avatar { width: 100%; height: 100%; border: 2px solid var(--bg-panel); }
.story-label { font-size: 10.5px; color: var(--text-dim); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.story-add-badge {
  position: relative;
}
.story-add-badge::after {
  content: "+"; position: absolute; bottom: -1px; left: -1px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--cyan); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg-panel);
}
.story-viewer {
  position: fixed; inset: 0; z-index: 100; background: #000;
  display: flex; align-items: center; justify-content: center;
}
.story-viewer img, .story-viewer video { max-width: 100%; max-height: 100%; object-fit: contain; }
.story-progress { position: absolute; top: 10px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,.25); border-radius: 2px; overflow: hidden; }
.story-progress-fill { height: 100%; width: 0%; background: #fff; }
.story-close { position: absolute; top: 16px; left: 16px; color: #fff; font-size: 24px; background: none; border: none; z-index: 5; }
.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #ffffff; font-size: 19px; flex-shrink: 0;
  position: relative;
}
.avatar.online::after {
  content: "";
  position: absolute; bottom: -1px; left: -1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--success); border: 2px solid var(--bg-panel);
}
.chat-item-body { flex: 1; min-width: 0; }
.chat-item-top { display: flex; justify-content: space-between; font-size: 14px; }
.chat-item-name { font-weight: 600; }
.chat-item-time { color: var(--text-faint); font-size: 11.5px; }
.chat-item-preview {
  color: var(--text-dim); font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.unread-dot {
  min-width: 20px; height: 20px; border-radius: 999px;
  background: var(--cyan); color: #ffffff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

.chat-main { display: flex; flex-direction: column; background: var(--bg-deep); }
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--border-soft);
  background: var(--bg-panel);
}
.chat-header-info h3 { margin: 0; font-size: 15px; }
.chat-header-info span { font-size: 12px; color: var(--text-dim); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border-soft); background: transparent;
  color: var(--text-dim); display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }
.attach-btn { border-radius: 50%; flex-shrink: 0; }

.messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.msg-row { display: flex; }
.msg-row.own { justify-content: flex-start; flex-direction: row-reverse; }
.bubble {
  max-width: 75%;
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.55;
  background: var(--other-bubble);
  border: none;
  box-shadow: 0 1px 2px rgba(0,0,0,.15);
}
.msg-row.own .bubble {
  background: var(--own-bubble);
  border: none;
}
.bubble-meta { display: flex; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--text-faint); justify-content: flex-end; }
.msg-row.own .bubble-meta { color: rgba(255,255,255,.55); }
[data-theme="light"] .msg-row.own .bubble-meta { color: rgba(0,0,0,.4); }

.composer {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-top: 1px solid var(--border-soft);
  background: var(--bg-panel);
}
.composer input {
  flex: 1; padding: 12px 16px; border-radius: 999px;
  border: 1px solid var(--border-soft); background: var(--bg-deep);
  color: var(--text-primary); font-size: 16px; outline: none;
}
.composer input:focus { border-color: var(--cyan); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  color: #ffffff; font-size: 16px; display: flex; align-items: center; justify-content: center;
}

.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-faint); gap: 10px; text-align: center; padding: 40px;
}
.empty-state .mark { font-size: 42px; opacity: .6; }

.hamburger { display: none; }
@media (max-width: 860px) {
  .hamburger { display: flex; }
}

</style>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="sidebar-backdrop" id="backdrop"></div>

<div id="newChatScreen" style="display:none; position:fixed; inset:0; z-index:40; background:var(--bg-panel); flex-direction:column;">
  <div class="settings-top" style="border-bottom:1px solid var(--border-soft);">
    <button class="icon-btn" onclick="closeNewChatSearch()">→</button>
    <h2 style="margin:0; font-size:16px;">گفتگوی جدید</h2>
  </div>
  <div class="sidebar-search">
    <input type="text" id="newChatQuery" placeholder="نام کاربری یا شماره تلفن..." oninput="debounceNewChatSearch()">
  </div>
  <div id="newChatResults" style="flex:1; overflow-y:auto;">
    <div class="empty-state" style="height:auto; padding-top:60px;"><div class="mark">🔍</div>یوزرنیم یا شماره تلفن رو تایپ کن</div>
  </div>
</div>

<div id="newGroupScreen" style="display:none; position:fixed; inset:0; z-index:40; background:var(--bg-panel); flex-direction:column;">
  <div class="settings-top" style="border-bottom:1px solid var(--border-soft);">
    <button class="icon-btn" onclick="closeNewGroupFlow()">→</button>
    <h2 style="margin:0; font-size:16px;">گروه جدید</h2>
  </div>

  <!-- step 1: pick members -->
  <div id="groupStepMembers">
    <div class="sidebar-search">
      <input type="text" id="groupMemberQuery" placeholder="جستجوی یوزرنیم برای افزودن..." oninput="debounceGroupMemberSearch()">
    </div>
    <div id="groupSelectedChips" style="display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px;"></div>
    <div id="groupMemberResults" style="overflow-y:auto; max-height:50vh;"></div>
    <div style="padding:16px;">
      <button class="btn btn-primary btn-block" onclick="goToGroupNameStep()">بعدی (<span id="groupMemberCount">0</span> نفر)</button>
    </div>
  </div>

  <!-- step 2: name -->
  <div id="groupStepName" style="display:none; padding:16px;">
    <div class="field">
      <label>نام گروه</label>
      <input type="text" id="groupNameInput" placeholder="مثلاً: دوستان دانشگاه">
    </div>
    <div class="field">
      <label>توضیحات (اختیاری)</label>
      <input type="text" id="groupDescInput">
    </div>
    <button class="btn btn-primary btn-block" onclick="finalizeCreateGroup()">ساخت گروه</button>
    <div id="groupCreateMsg" class="auth-msg"></div>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand"><span class="brand-mark">C</span> Cyber Chat</div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" onclick="toggleTheme()" title="تغییر تم">🌓</button>
      </div>
    </div>
    <div class="sidebar-search">
      <input type="text" id="chatSearch" placeholder="جستجو در گفتگوها و کاربران...">
    </div>
    <button class="fab" onclick="handleFabClick()" title="گفتگوی جدید">✎</button>
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" id="tabChats" onclick="switchListTab('chats')">چت‌ها</div>
      <div class="sidebar-tab" id="tabGroups" onclick="switchListTab('groups')">گروه‌ها</div>
      <div class="sidebar-tab" id="tabChannels" onclick="switchListTab('channels')">کانال‌ها</div>
    </div>
    <div class="stories-bar" id="storiesBar"></div>
    <input type="file" id="storyFileInput" accept="image/*" style="display:none" onchange="handleStoryUpload(event)">
    <div class="chat-list" id="chatList">

<script>
// ============================================================
// Cyber Chat — Supabase client bootstrap
// Loaded via CDN script tag before this file (see HTML files).
// ============================================================

const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.CYBERCHAT_CONFIG;

window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
  },
  realtime: {
    params: { eventsPerSecond: 10 },
  },
});

// ---------- shared auth helpers ----------

// Redirect to /auth.html if not logged in. Call at the top of protected pages.
async function requireAuth() {
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = "auth.html";
    return null;
  }
  return session;
}

// Redirect away from auth page if already logged in.
async function redirectIfLoggedIn() {
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session) window.location.href = "app.html";
}

async function getCurrentProfile() {
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  if (!user) return null;
  const { data, error } = await window.supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();
  if (error) {
    console.error("getCurrentProfile error:", error);
    return null;
  }
  return data;
}

async function signOutCyberChat() {
  await window.supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

// Mark the current user online / update last_seen. Call on load + beforeunload.
async function setPresence(isOnline) {
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  if (!user) return;
  await window.supabaseClient
    .from("profiles")
    .update({ is_online: isOnline, last_seen: new Date().toISOString() })
    .eq("id", user.id);
}

</script>
<script>
// ============================================================
// Cyber Chat — Messenger app logic (Phase 1–3: auth, private chat, realtime)
// Groups / channels / admin panel / media upload land in later phases.
// ============================================================

let me = null;
let presenceInterval = null;

function startPresenceHeartbeat() {
  setPresence(true);
  if (presenceInterval) clearInterval(presenceInterval);
  presenceInterval = setInterval(() => setPresence(true), 25000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    setPresence(false);
    if (presenceInterval) clearInterval(presenceInterval);
  } else if (me) {
    startPresenceHeartbeat();
  }
});
window.addEventListener("pagehide", () => setPresence(false));
window.addEventListener("beforeunload", () => setPresence(false));

// Trust is_online only if the heartbeat is recent — protects against a flag
// that never got cleared (app killed, network dropped, etc).
function isActuallyOnline(profile) {
  if (!profile?.is_online || !profile?.last_seen) return false;
  return (Date.now() - new Date(profile.last_seen).getTime()) < 35000;
}

// ---------- browser notifications for messages in chats you're not currently viewing ----------
let globalMsgSub = null;
function subscribeToAllMessagesForNotifications() {
  if (globalMsgSub) window.supabaseClient.removeChannel(globalMsgSub);

  globalMsgSub = window.supabaseClient
    .channel("global-message-notify")
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages" },
      async (payload) => {
        const msg = payload.new;
        if (msg.sender_id === me.id) return; // don't notify on your own messages

        // if it's for the chat currently open, just refresh unread state elsewhere (no popup needed)
        if (msg.chat_id === activeChatId) return;

        // refresh the badge counts in the background
        if (activeListTab === "groups") loadGroupList(); else loadChatList();

        if (document.hidden && Notification.permission === "granted") {
          const { data: sender } = await window.supabaseClient
            .from("profiles").select("first_name, last_name, username").eq("id", msg.sender_id).single();
          const name = sender ? (`${sender.first_name || ""} ${sender.last_name || ""}`.trim() || sender.username) : "پیام جدید";
          const body = msg.message_type === "text" ? msg.content : `📎 ${msg.message_type}`;
          try {
            if (navigator.serviceWorker?.ready) {
              const reg = await navigator.serviceWorker.ready;
              reg.showNotification(name, { body, icon: "icon-192.png" });
            } else {
              new Notification(name, { body });
            }
          } catch (e) { /* notifications not available — silently skip */ }
        }
      }
    )
    .subscribe();
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) return "unsupported";
  if (Notification.permission === "granted") return "granted";
  return await Notification.requestPermission();
}

let messagesSub = null;

// ---------- chat list ----------
let chatCache = [];

async function loadChatList() {
  document.getElementById("chatList").innerHTML =
    `<div class="empty-state"><div class="mark">💬</div>در حال بارگذاری...</div>`;

  // single round-trip RPC — critical for connections with high latency
  const { data, error } = await window.supabaseClient.rpc("get_my_chat_list");

  if (error) { console.error(error); renderChatList([]); return; }
  if (!data || data.length === 0) { chatCache = []; renderChatList([]); return; }

  const chats = data.map(row => ({
    chatId: row.chat_id,
    is_muted: row.is_muted,
    other: {
      id: row.other_id,
      username: row.other_username,
      first_name: row.other_first_name,
      last_name: row.other_last_name,
      avatar_url: row.other_avatar_url,
      is_online: row.other_is_online,
      last_seen: row.other_last_seen,
      is_premium: row.other_is_premium,
    },
    lastMsg: row.last_created_at ? {
      content: row.last_content,
      message_type: row.last_message_type,
      created_at: row.last_created_at,
    } : null,
    unreadCount: row.unread_count || 0,
  }));

  chatCache = chats;
  renderChatList(chats);
}

function renderChatList(chats) {
  const list = document.getElementById("chatList");

  const savedRow = `
    <div class="chat-row-wrap">
      <div class="chat-item" onclick="openSavedMessages()">
        <div class="avatar" style="background:linear-gradient(135deg, var(--cyan), var(--magenta));">🔖</div>
        <div class="chat-item-body">
          <div class="chat-item-top"><span class="chat-item-name">پیام‌های ذخیره‌شده</span></div>
          <div class="chat-item-preview">یادداشت‌ها و فایل‌های شخصی خودت</div>
        </div>
      </div>
    </div>`;

  if (chats.length === 0) {
    list.innerHTML = savedRow + `<div class="empty-state"><div class="mark">💬</div>هنوز گفتگویی نداری<br>روی ✎ بزن و یک چت جدید بساز</div>`;
    return;
  }

  list.innerHTML = savedRow + chats.map(c => {
    const name = `${c.other.first_name || ""} ${c.other.last_name || ""}`.trim() || c.other.username;
    const preview = c.lastMsg
      ? (c.lastMsg.message_type === "text" ? c.lastMsg.content : `📎 ${c.lastMsg.message_type}`)
      : "شروع گفتگو...";
    const time = c.lastMsg ? formatTime(c.lastMsg.created_at) : "";
    const avatarStyle = c.other.avatar_url ? `style="background-image:url(${c.other.avatar_url})"` : "";
    return `
      <div class="chat-row-wrap" data-chatid="${c.chatId}">
        <div class="chat-row-actions">
          <button class="mute-btn" onclick="event.stopPropagation(); muteChat('${c.chatId}', ${!!c.is_muted})">${c.is_muted ? "🔔" : "🔕"}</button>
          <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${c.chatId}')">🗑️</button>
        </div>
        <div class="chat-item" onclick="handleChatItemClick(event, '${c.chatId}', this)">
          <div class="avatar ${isActuallyOnline(c.other) ? "online" : ""}" ${avatarStyle}>${c.other.avatar_url ? "" : initials(name)}</div>
          <div class="chat-item-body">
            <div class="chat-item-top">
              <span class="chat-item-name">${escapeHtml(name)} ${c.other.is_premium ? "⭐" : ""} ${c.is_muted ? "🔕" : ""}</span>
              <span class="chat-item-time">${time}</span>
            </div>
            <div class="chat-item-preview">${escapeHtml(preview || "")}</div>
          </div>
          ${c.unreadCount > 0 ? `<div class="unread-dot">${c.unreadCount > 99 ? "99+" : c.unreadCount}</div>` : ""}
        </div>
      </div>`;
  }).join("");

  attachChatListSwipe(list);
}

function handleChatItemClick(event, chatId, itemEl) {
  const wrap = itemEl.closest(".chat-row-wrap");
  if (wrap.classList.contains("swiped")) {
    itemEl.style.transform = "translateX(0)";
    wrap.classList.remove("swiped");
    return;
  }
  openChat(chatId);
}

function attachChatListSwipe(container) {
  let startX = 0, activeItem = null, activeWrap = null, swiping = false;

  container.addEventListener("touchstart", (e) => {
    const wrap = e.target.closest(".chat-row-wrap");
    if (!wrap || !wrap.dataset.chatid) return;
    activeWrap = wrap;
    activeItem = wrap.querySelector(".chat-item");
    startX = e.touches[0].clientX;
    swiping = true;
  }, { passive: true });

  container.addEventListener("touchmove", (e) => {
    if (!swiping || !activeItem) return;
    const dx = e.touches[0].clientX - startX;
    const base = activeWrap.classList.contains("swiped") ? -140 : 0;
    const val = Math.min(0, Math.max(-140, base + dx));
    activeItem.style.transform = `translateX(${val}px)`;
  }, { passive: true });

  container.addEventListener("touchend", (e) => {
    if (!swiping || !activeItem) return;
    const dx = e.changedTouches[0].clientX - startX;
    const base = activeWrap.classList.contains("swiped") ? -140 : 0;
    const finalVal = base + dx;
    if (finalVal < -70) {
      activeItem.style.transform = "translateX(-140px)";
      activeWrap.classList.add("swiped");
    } else {
      activeItem.style.transform = "translateX(0)";
      activeWrap.classList.remove("swiped");
    }
    swiping = false; activeItem = null; activeWrap = null;
  });
}

async function muteChat(chatId, currentlyMuted) {

    .update({ is_muted: !currentlyMuted }).eq("chat_id", chatId).eq("user_id", me.id);

  await window.supabaseClient.from("chat_members")

}

// ---------- Stories ----------
async function loadStoriesBar() {
  const bar = document.getElementById("storiesBar");

  const { data, error } = await window.supabaseClient
    .from("stories")
    .select("id, user_id, media_path, created_at, profiles:user_id(username, first_name, last_name, avatar_url)")
    .order("created_at", { ascending: true });

  const myOwn = (data || []).filter(s => s.user_id === me.id);
  const others = (data || []).filter(s => s.user_id !== me.id);

  // group others by user
  const byUser = {};
  others.forEach(s => {
    if (!byUser[s.user_id]) byUser[s.user_id] = { profile: s.profiles, stories: [] };
    byUser[s.user_id].stories.push(s);
  });

  let html = `
    <div class="story-avatar-wrap" onclick="${myOwn.length ? `viewStories('${me.id}')` : "document.getElementById('storyFileInput').click()"}">
      <div class="story-ring ${myOwn.length ? "" : ""}">
        <div class="avatar story-add-badge" style="width:100%; height:100%; font-size:18px; ${me.avatar_url ? `background-image:url(${me.avatar_url})` : ""}">${me.avatar_url ? "" : initials(me.first_name || me.username || "?")}</div>
      </div>
      <div class="story-label">استوری شما</div>
    </div>`;

  html += Object.entries(byUser).map(([uid, group]) => {
    const p = group.profile;
    const name = `${p.first_name || ""} ${p.last_name || ""}`.trim() || p.username;
    return `
      <div class="story-avatar-wrap" onclick="viewStories('${uid}')">
        <div class="story-ring">
          <div class="avatar" style="width:100%; height:100%; font-size:18px; ${p.avatar_url ? `background-image:url(${p.avatar_url})` : ""}">${p.avatar_url ? "" : initials(name)}</div>
        </div>
        <div class="story-label">${escapeHtml(name)}</div>
      </div>`;
  }).join("");

  bar.innerHTML = html;
  window._storiesByUser = byUser;
  window._myStories = myOwn;
}

async function handleStoryUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { alert("حجم عکس نباید بیشتر از ۲۰ مگابایت باشد"); return; }

  const ext = file.name.split(".").pop();
  const path = `${me.id}/${crypto.randomUUID()}.${ext}`;

  const { error: upErr } = await window.supabaseClient.storage.from("stories").upload(path, file);
  if (upErr) { alert("خطا در آپلود: " + upErr.message); return; }

  const { error: dbErr } = await window.supabaseClient.from("stories").insert({
    user_id: me.id, media_path: path, media_type: "image",
  });
  if (dbErr) { alert("خطا: " + dbErr.message); return; }

  event.target.value = "";
  await loadStoriesBar();
  alert("استوری منتشر شد ✓ (تا ۲۴ ساعت روی پروفایلت می‌مونه)");
}

async function viewStories(userId) {
  const stories = userId === me.id ? window._myStories : window._storiesByUser[userId]?.stories;
  if (!stories || stories.length === 0) return;

  let index = 0;
  const viewer = document.createElement("div");
  viewer.className = "story-viewer";
  document.body.appendChild(viewer);

  function render() {
    const s = stories[index];
    const url = window.supabaseClient.storage.from("stories").getPublicUrl(s.media_path).data.publicUrl;
    viewer.innerHTML = `
      <div class="story-progress"><div class="story-progress-fill" id="storyProgressFill"></div></div>
      <button class="story-close" onclick="this.closest('.story-viewer').remove()">✕</button>
      <img src="${url}">
    `;
    window.supabaseClient.from("story_views").upsert(
      { story_id: s.id, viewer_id: me.id }, { onConflict: "story_id,viewer_id" }
    );

    const fill = document.getElementById("storyProgressFill");
    let progress = 0;
    const interval = setInterval(() => {
      progress += 2;
      if (fill) fill.style.width = progress + "%";
      if (progress >= 100) {
        clearInterval(interval);
        if (index < stories.length - 1) { index++; render(); }
        else viewer.remove();
      }
    }, 100);

    viewer.onclick = (e) => {
      if (e.target.classList.contains("story-close")) return;
      clearInterval(interval);
      if (index < stories.length - 1) { index++; render(); }
      else viewer.remove();
    };
  }
  render();
}


function filterChatList(query) {
  if (!query) return renderChatList(chatCache);
  const filtered = chatCache.filter(c => {
    const name = `${c.other.first_name || ""} ${c.other.last_name || ""} ${c.other.username}`.toLowerCase();
    return name.includes(query.toLowerCase());
  });
  renderChatList(filtered);
}

// ---------- starting a new chat by username ----------
function openNewChatSearch() {
  document.getElementById("newChatScreen").style.display = "flex";
  document.getElementById("newChatQuery").value = "";
  document.getElementById("newChatQuery").focus();
  document.getElementById("newChatResults").innerHTML =
    `<div class="empty-state" style="height:auto; padding-top:60px;"><div class="mark">🔍</div>یوزرنیم یا شماره تلفن رو تایپ کن</div>`;
}
function closeNewChatSearch() {
  document.getElementById("newChatScreen").style.display = "none";
}

let newChatDebounceTimer = null;
function debounceNewChatSearch() {
  clearTimeout(newChatDebounceTimer);
  newChatDebounceTimer = setTimeout(runNewChatSearch, 350);
}

async function runNewChatSearch() {
  const q = document.getElementById("newChatQuery").value.trim();
  const results = document.getElementById("newChatResults");
  if (!q) {
    results.innerHTML = `<div class="empty-state" style="height:auto; padding-top:60px;"><div class="mark">🔍</div>یوزرنیم یا شماره تلفن رو تایپ کن</div>`;
    return;
  }

  const isPhone = /^[+0-9\s-]{4,}$/.test(q);
  let query = window.supabaseClient.from("profiles")
    .select("id, username, first_name, last_name, avatar_url, is_online")
    .neq("id", me.id).limit(20);
  query = isPhone ? query.ilike("phone", `%${q}%`) : query.ilike("username", `%${q}%`);

  const { data, error } = await query;

  if (error || !data || data.length === 0) {
    results.innerHTML = `<div class="empty-state" style="height:auto; padding-top:60px;"><div class="mark">🚫</div>کسی پیدا نشد</div>`;
    return;
  }

  results.innerHTML = data.map(u => {
    const name = `${u.first_name || ""} ${u.last_name || ""}`.trim() || u.username;
    const avatarStyle = u.avatar_url ? `style="background-image:url(${u.avatar_url})"` : "";
    return `
      <div class="chat-item" onclick="startChatFromSearch('${u.id}')">
        <div class="avatar ${isActuallyOnline(u) ? "online" : ""}" ${avatarStyle}>${u.avatar_url ? "" : initials(name)}</div>
        <div class="chat-item-body">
          <div class="chat-item-top"><span class="chat-item-name">${escapeHtml(name)}</span></div>
          <div class="chat-item-preview">@${escapeHtml(u.username || "")}</div>
        </div>
      </div>`;
  }).join("");
}

async function startChatFromSearch(targetId) {
  await window.supabaseClient.from("contacts").upsert(
    { owner_id: me.id, contact_id: targetId }, { onConflict: "owner_id,contact_id" }
  );

  const { data: chatId, error: rpcErr } = await window.supabaseClient
    .rpc("create_private_chat", { target_user_id: targetId });

  if (rpcErr) { alert("خطا در ساخت چت: " + rpcErr.message); return; }

  closeNewChatSearch();
  await loadChatList();
  openChat(chatId);
}

// ---------- new group flow ----------
let selectedGroupMembers = {}; // id -> {id, username, name}

function openNewGroupFlow() {
  selectedGroupMembers = {};
  document.getElementById("newGroupScreen").style.display = "flex";
  document.getElementById("groupStepMembers").style.display = "block";
  document.getElementById("groupStepName").style.display = "none";
  document.getElementById("groupMemberQuery").value = "";
  document.getElementById("groupMemberResults").innerHTML = "";
  renderGroupChips();
}
function closeNewGroupFlow() {
  document.getElementById("newGroupScreen").style.display = "none";
}

let groupMemberSearchTimer = null;
function debounceGroupMemberSearch() {
  clearTimeout(groupMemberSearchTimer);
  groupMemberSearchTimer = setTimeout(runGroupMemberSearch, 300);
}

async function runGroupMemberSearch() {
  const q = document.getElementById("groupMemberQuery").value.trim();
  const results = document.getElementById("groupMemberResults");
  if (!q) { results.innerHTML = ""; return; }

  const { data, error } = await window.supabaseClient
    .from("profiles").select("id, username, first_name, last_name, avatar_url")
    .neq("id", me.id).ilike("username", `%${q}%`).limit(20);

  if (error || !data || data.length === 0) {
    results.innerHTML = `<div style="padding:16px; color:var(--text-dim); text-align:center;">کسی پیدا نشد</div>`;
    return;
  }

  results.innerHTML = data.map(u => {
    const name = `${u.first_name || ""} ${u.last_name || ""}`.trim() || u.username;
    const checked = selectedGroupMembers[u.id] ? "✓" : "+";
    return `
      <div class="chat-item" onclick='toggleGroupMember(${JSON.stringify(u.id)}, ${JSON.stringify(name)})'>
        <div class="avatar" style="${u.avatar_url ? `background-image:url(${u.avatar_url})` : ""}">${u.avatar_url ? "" : initials(name)}</div>
        <div class="chat-item-body"><div class="chat-item-top"><span class="chat-item-name">${escapeHtml(name)}</span></div></div>
        <div class="icon-btn" style="border-radius:50%;">${checked}</div>
      </div>`;
  }).join("");
}

function toggleGroupMember(id, name) {
  if (selectedGroupMembers[id]) delete selectedGroupMembers[id];
  else selectedGroupMembers[id] = { id, name };
  renderGroupChips();
  runGroupMemberSearch();
}

function renderGroupChips() {
  const count = Object.keys(selectedGroupMembers).length;
  document.getElementById("groupMemberCount").textContent = count;
  document.getElementById("groupSelectedChips").innerHTML = Object.values(selectedGroupMembers).map(m => `
    <span class="badge-pill" style="background:var(--bg-elevated); color:var(--text-primary); display:inline-flex; align-items:center; gap:6px; padding:5px 10px;">
      ${escapeHtml(m.name)} <span style="cursor:pointer;" onclick='toggleGroupMember(${JSON.stringify(m.id)}, ${JSON.stringify(m.name)})'>✕</span>
    </span>`).join("");
}

function goToGroupNameStep() {
  if (Object.keys(selectedGroupMembers).length === 0) {
    if (!confirm("بدون افزودن عضوی ادامه بدیم؟ می‌تونی بعداً اضافه کنی.")) return;
  }
  document.getElementById("groupStepMembers").style.display = "none";
  document.getElementById("groupStepName").style.display = "block";
  document.getElementById("groupNameInput").focus();
}

async function finalizeCreateGroup() {
  const name = document.getElementById("groupNameInput").value.trim();
  const desc = document.getElementById("groupDescInput").value.trim();
  const msgEl = document.getElementById("groupCreateMsg");

  if (!name) { msgEl.textContent = "نام گروه لازمه"; msgEl.className = "auth-msg error"; return; }
  msgEl.textContent = "در حال ساخت...";
  msgEl.className = "auth-msg";

  const memberIds = Object.keys(selectedGroupMembers);
  const { data: chatId, error } = await window.supabaseClient
    .rpc("create_group", { _name: name, _description: desc, _member_ids: memberIds });

  if (error) { msgEl.textContent = "خطا: " + error.message; msgEl.className = "auth-msg error"; return; }

  closeNewGroupFlow();
  activeListTab = "groups";
  document.getElementById("tabChats").classList.remove("active");
  document.getElementById("tabGroups").classList.add("active");
  await loadGroupList();
  openGroupChat(chatId, null);
}

// ---------- opening a chat + realtime ----------
let messageCache = {}; // id -> message, for showing reply previews
let replyingTo = null;

async function openChat(chatId, override) {
  activeChatId = chatId;
  replyingTo = null;
  openChatMobile();

  const chatInfo = chatCache.find(c => c.chatId === chatId);
  const other = chatInfo?.other;
  const name = override?.name || (other ? (`${other.first_name || ""} ${other.last_name || ""}`.trim() || other.username) : "چت");
  const avatarUrlToUse = override?.avatarUrl || other?.avatar_url;
  const headerAvatarStyle = avatarUrlToUse ? `style="background-image:url(${avatarUrlToUse})"` : "";
  const headerClickAttr = override?.noHeaderLink ? "" :
    `onclick="window.location.href='${override?.headerLink || `user.html?id=${other?.id || ''}`}'"`;

  const main = document.getElementById("chatMain");
  main.innerHTML = `
    <div class="chat-header">
      <button class="icon-btn" onclick="closeChatMobile()">→</button>
      <div style="display:flex; align-items:center; gap:12px; cursor:pointer; flex:1;" ${headerClickAttr}>
        <div class="avatar ${isActuallyOnline(other) ? "online" : ""}" ${headerAvatarStyle}>${avatarUrlToUse ? "" : (override?.icon || initials(name))}</div>
        <div class="chat-header-info">
          <h3>${escapeHtml(name)} ${other?.is_premium ? "⭐" : ""}</h3>
          <span>${override ? "" : (isActuallyOnline(other) ? "آنلاین" : "آخرین بازدید " + (other ? formatTime(other.last_seen) : ""))}</span>
        </div>
      </div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div id="replyPreview" style="display:none; padding:8px 16px; background:var(--bg-elevated); border-top:1px solid var(--border-soft); font-size:12.5px; color:var(--text-dim); display:flex; justify-content:space-between; align-items:center;">
      <span id="replyPreviewText"></span>
      <button class="icon-btn" style="width:26px;height:26px;" onclick="cancelReply()">✕</button>
    </div>
    <div class="composer">
      <button class="icon-btn attach-btn" onclick="document.getElementById('mediaInput').click()" title="پیوست عکس، ویدیو، فایل یا آهنگ">📎</button>
      <input type="file" id="mediaInput" style="display:none" onchange="handleMediaUpload(event)">
      <input type="text" id="msgInput" placeholder="پیام خود را بنویس..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  `;

  await loadMessages(chatId);
  subscribeToMessages(chatId);
  attachSwipeHandlers(document.getElementById("messagesArea"));

  window.supabaseClient.rpc("mark_chat_read", { _chat_id: chatId }).then(() => {
    // clear the badge locally without a full reload
    const wrap = document.querySelector(`.chat-row-wrap[data-chatid="${chatId}"] .unread-dot, .chat-item[data-chatid="${chatId}"] .unread-dot`);
    if (wrap) wrap.remove();
    const chatEntry = chatCache.find(c => c.chatId === chatId);
    if (chatEntry) chatEntry.unreadCount = 0;
    const groupEntry = groupCache.find(g => g.chatId === chatId);
    if (groupEntry) groupEntry.unreadCount = 0;
  });
}

async function loadMessages(chatId) {
  const { data, error } = await window.supabaseClient
    .from("messages")
    .select("*, message_attachments(*)")
    .eq("chat_id", chatId)
    .eq("is_deleted", false)
    .order("created_at", { ascending: true })
    .limit(200); // pagination for older history: future phase

  if (error) { console.error(error); return; }
  data.forEach(m => messageCache[m.id] = m);
  const area = document.getElementById("messagesArea");
  area.innerHTML = data.map(renderMessageBubble).join("");
  area.scrollTop = area.scrollHeight;
}

function renderMessageBubble(msg) {
  const own = msg.sender_id === me.id;
  const replySnippet = msg.reply_to && messageCache[msg.reply_to]
    ? `<div style="border-right:2px solid var(--cyan); padding-right:8px; margin-bottom:6px; font-size:12px; color:var(--text-dim); opacity:.85;">${escapeHtml((messageCache[msg.reply_to].content || "").slice(0, 80))}</div>`
    : "";

  let mediaHtml = "";
  const att = msg.message_attachments?.[0];
  if (att) {
    const url = window.supabaseClient.storage.from(bucketForType(msg.message_type)).getPublicUrl(att.storage_path).data.publicUrl;
    if (msg.message_type === "image") mediaHtml = `<img src="${url}" style="max-width:100%; border-radius:10px; margin-bottom:6px; display:block;">`;
    else if (msg.message_type === "video") mediaHtml = `<video src="${url}" controls style="max-width:100%; border-radius:10px; margin-bottom:6px; display:block;"></video>`;
    else if (msg.message_type === "voice") mediaHtml = `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; min-width:220px;">
        <div style="width:34px; height:34px; border-radius:50%; background:var(--cyan); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;">🎵</div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(att.file_name || "فایل صوتی")}</div>
          <audio src="${url}" controls style="width:100%; height:32px; margin-top:2px;"></audio>
        </div>
      </div>`;
    else mediaHtml = `<a href="${url}" target="_blank" style="display:block; margin-bottom:6px; color:var(--cyan);">📎 ${escapeHtml(att.file_name || "فایل")}</a>`;
  }

  return `
    <div class="msg-row ${own ? "own" : ""}" data-id="${msg.id}">
      <div class="bubble">
        <div style="display:flex; gap:6px; justify-content:flex-end; margin-bottom:2px;">
          <span onclick='startReply(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="ریپلای">↩</span>
          <span onclick='startForward(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="فوروارد">➦</span>
          ${own ? "" : `<span onclick='reportMessage(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="گزارش">🚩</span>`}
        </div>
        ${replySnippet}
        ${mediaHtml}
        ${msg.content ? escapeHtml(msg.content) : ""}
        <div class="bubble-meta">${formatTime(msg.created_at)}${own ? " · " + statusIcon(msg.status) : ""}</div>
      </div>
    </div>`;
}

function bucketForType(type) {
  return { image: "chat-images", video: "chat-videos", voice: "chat-voice" }[type] || "chat-files";
}

function statusIcon(status) {
  return { sending: "…", sent: "✓", delivered: "✓✓", read: "✓✓" }[status] || "";
}

// ---------- swipe-left-to-reply (Telegram-style gesture) ----------
function attachSwipeHandlers(container) {
  if (!container) return;
  let startX = 0, activeBubble = null, activeRow = null, swiping = false;

  container.addEventListener("touchstart", (e) => {
    const row = e.target.closest(".msg-row");
    if (!row) return;
    activeRow = row;
    activeBubble = row.querySelector(".bubble");
    startX = e.touches[0].clientX;
    swiping = true;
  }, { passive: true });

  container.addEventListener("touchmove", (e) => {
    if (!swiping || !activeBubble) return;
    const dx = e.touches[0].clientX - startX;
    if (dx < 0) activeBubble.style.transform = `translateX(${Math.max(dx, -60)}px)`;
  }, { passive: true });

  container.addEventListener("touchend", (e) => {
    if (!swiping || !activeBubble) return;
    const dx = e.changedTouches[0].clientX - startX;
    activeBubble.style.transition = "transform .15s ease";
    activeBubble.style.transform = "translateX(0)";
    setTimeout(() => { if (activeBubble) activeBubble.style.transition = ""; }, 200);
    if (dx < -45) startReply(activeRow.dataset.id);
    swiping = false; activeBubble = null; activeRow = null;
  });
}

function startReply(messageId) {
  replyingTo = messageId;
  const msg = messageCache[messageId];
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyPreviewText").textContent = "ریپلای به: " + (msg?.content || "پیام").slice(0, 60);
  document.getElementById("msgInput").focus();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById("replyPreview").style.display = "none";
}

async function startForward(messageId) {
  const msg = messageCache[messageId];
  if (!msg) return;
  const username = prompt("فوروارد به کدوم یوزرنیم؟");
  if (!username) return;

  const { data: target, error } = await window.supabaseClient
    .from("profiles").select("id").ilike("username", username.trim()).single();
  if (error || !target) { alert("کاربر پیدا نشد"); return; }

  const { data: chatId, error: rpcErr } = await window.supabaseClient
    .rpc("create_private_chat", { target_user_id: target.id });
  if (rpcErr) { alert("خطا: " + rpcErr.message); return; }

  const { error: sendErr } = await window.supabaseClient.from("messages").insert({
    chat_id: chatId, sender_id: me.id, content: msg.content,
    message_type: msg.message_type, forwarded_from: msg.id, status: "sent",
  });
  if (sendErr) alert("خطا در فوروارد: " + sendErr.message);
  else alert("فوروارد شد ✓");
}

async function reportMessage(messageId) {
  const reason = prompt("دلیل گزارش این پیام رو بنویس:");
  if (!reason) return;
  const { error } = await window.supabaseClient.from("reports").insert({
    reporter_id: me.id, target_type: "message", target_id: messageId, reason,
  });
  if (error) alert("خطا: " + error.message);
  else alert("پیام گزارش شد ✓");
}

function subscribeToMessages(chatId) {
  if (messagesSub) window.supabaseClient.removeChannel(messagesSub);

  messagesSub = window.supabaseClient
    .channel(`messages:${chatId}`)
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: `chat_id=eq.${chatId}` },
      async (payload) => {
        const area = document.getElementById("messagesArea");
        if (!area) return;
        // already rendered optimistically by sendMessage() on this device — skip re-render
        if (document.querySelector(`[data-id="${payload.new.id}"]`)) {
          const { data: full } = await window.supabaseClient
            .from("messages").select("*, message_attachments(*)").eq("id", payload.new.id).single();
          if (full) messageCache[full.id] = full;
          return;
        }
        // fetch with attachments joined (realtime payload doesn't include joins)
        const { data: full } = await window.supabaseClient
          .from("messages").select("*, message_attachments(*)").eq("id", payload.new.id).single();
        const msg = full || payload.new;
        messageCache[msg.id] = msg;
        area.insertAdjacentHTML("beforeend", renderMessageBubble(msg));
        area.scrollTop = area.scrollHeight;
      }
    )
    .subscribe();
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const content = input.value.trim();
  if (!content || !activeChatId) return;
  input.value = "";

  // render immediately (optimistic) instead of waiting for the realtime echo,
  // which can lag a few seconds — we generate the id ourselves so the
  // realtime INSERT event for this same row is recognized and skipped.
  const tempId = crypto.randomUUID();
  const optimisticMsg = {
    id: tempId, chat_id: activeChatId, sender_id: me.id, content,
    message_type: "text", status: "sending", created_at: new Date().toISOString(),
  };
  messageCache[tempId] = optimisticMsg;
  const area = document.getElementById("messagesArea");
  if (area) {
    area.insertAdjacentHTML("beforeend", renderMessageBubble(optimisticMsg));
    area.scrollTop = area.scrollHeight;
  }

  const payload = {
    id: tempId,
    chat_id: activeChatId,
    sender_id: me.id,
    content,
    message_type: "text",
    status: "sent",
  };
  if (replyingTo) payload.reply_to = replyingTo;
  const usedReply = replyingTo;
  cancelReply();

  const { error } = await window.supabaseClient.from("messages").insert(payload);

  if (error) {
    alert("ارسال پیام ناموفق بود: " + error.message);
    const row = document.querySelector(`[data-id="${tempId}"]`);
    if (row) row.remove();
    delete messageCache[tempId];
    return;
  }

  const row = document.querySelector(`[data-id="${tempId}"]`);
  if (row) {
    const meta = row.querySelector(".bubble-meta");
    if (meta) meta.textContent = formatTime(optimisticMsg.created_at) + " · ✓";
  }
}

async function handleMediaUpload(event) {
  const file = event.target.files[0];
  if (!file || !activeChatId) return;

  if (file.size > 45 * 1024 * 1024) {
    alert("حجم فایل نباید بیشتر از ۴۵ مگابایت باشد (سقف واقعی پلن رایگان Supabase، ۵۰ مگابایته)");
    return;
  }

  let type = "file";
  if (file.type.startsWith("image/")) type = "image";
  else if (file.type.startsWith("video/")) type = "video";
  else if (file.type.startsWith("audio/")) type = "voice";

  const bucket = bucketForType(type);
  const path = `${activeChatId}/${crypto.randomUUID()}-${file.name}`;

  const { error: upErr } = await window.supabaseClient.storage.from(bucket).upload(path, file);
  if (upErr) { alert("خطا در آپلود: " + upErr.message); return; }

  const { data: newMsg, error: msgErr } = await window.supabaseClient
    .from("messages")
    .insert({ chat_id: activeChatId, sender_id: me.id, message_type: type, status: "sent" })
    .select().single();

  if (msgErr) { alert("خطا: " + msgErr.message); return; }

  await window.supabaseClient.from("message_attachments").insert({
    message_id: newMsg.id,
    storage_path: path,
    file_name: file.name,
    file_type: file.type,
    file_size: file.size,
  });

  event.target.value = "";
}

// ---------- utils ----------
function initials(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}
function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
