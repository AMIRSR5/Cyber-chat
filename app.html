<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Cyber Chat — Design tokens
   Palette: deep signal-blue base, cyan/magenta dual accent
   Type: Vazirmatn (Persian UI) + JetBrains Mono (labels/brand)
   Signature: "signal ring" pulse on presence + scanline hero
   ============================================================ */

:root {
  --bg-deep: #090c11;
  --bg-panel: #10151d;
  --bg-elevated: #161c26;
  --border-soft: #232b38;

  --cyan: #00e5ff;
  --magenta: #ff2d95;
  --success: #3ddc84;
  --danger: #ff4d5e;

  --text-primary: #e8edf4;
  --text-dim: #8b96a8;
  --text-faint: #586272;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;

  --shadow-glow: 0 0 24px rgba(0, 229, 255, 0.15);
}

/* Light mode overrides */
[data-theme="light"] {
  --bg-deep: #f4f6fa;
  --bg-panel: #ffffff;
  --bg-elevated: #ffffff;
  --border-soft: #e2e6ee;
  --text-primary: #10151d;
  --text-dim: #5b6577;
  --text-faint: #94a0b3;
  --shadow-glow: 0 0 24px rgba(0, 150, 200, 0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: "Vazirmatn", -apple-system, sans-serif;
  direction: rtl;
}

.mono {
  font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.02em;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

::selection { background: var(--cyan); color: #04141a; }

/* ---------- scrollbar ---------- */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   Landing page
   ============================================================ */

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 6vw;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(12px);
  background: rgba(9, 12, 17, 0.7);
  border-bottom: 1px solid var(--border-soft);
}
[data-theme="light"] .nav { background: rgba(244, 246, 250, 0.8); }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "JetBrains Mono", monospace;
  font-weight: 700;
  font-size: 18px;
}
.brand-mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #05080c; font-weight: 900;
  box-shadow: var(--shadow-glow);
}

.nav-actions { display: flex; gap: 10px; }

.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  transition: all .15s ease;
}
.btn:hover { border-color: var(--cyan); }
.btn-primary {
  background: linear-gradient(135deg, var(--cyan), #00b8d4);
  color: #04141a;
  border: none;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { border: none; color: var(--text-dim); }
.btn-block { width: 100%; padding: 13px; font-size: 15px; }

.hero {
  position: relative;
  padding: 90px 6vw 60px;
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: -20% -10% auto -10%;
  height: 480px;
  background:
    repeating-linear-gradient(180deg, rgba(0,229,255,.05) 0 1px, transparent 1px 3px);
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-family: "JetBrains Mono", monospace;
  color: var(--cyan);
  font-size: 13px;
  letter-spacing: 0.15em;
  margin-bottom: 18px;
}
.hero h1 {
  font-size: clamp(32px, 6vw, 64px);
  line-height: 1.15;
  margin: 0 0 20px;
  font-weight: 800;
}
.hero h1 .grad {
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p {
  max-width: 560px;
  margin: 0 auto 34px;
  color: var(--text-dim);
  font-size: 17px;
  line-height: 1.8;
}
.hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.section { padding: 70px 6vw; }
.section-title {
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 10px;
}
.section-sub {
  text-align: center;
  color: var(--text-dim);
  margin-bottom: 44px;
  font-size: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px;
  max-width: 1100px;
  margin: 0 auto;
}
.card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 24px;
  transition: border-color .15s ease, transform .15s ease;
}
.card:hover { border-color: var(--cyan); transform: translateY(-2px); }
.card-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,229,255,.1);
  color: var(--cyan);
  margin-bottom: 14px;
  font-size: 18px;
}
.card h3 { margin: 0 0 8px; font-size: 16px; }
.card p { margin: 0; color: var(--text-dim); font-size: 13.5px; line-height: 1.7; }

.premium-band {
  background: linear-gradient(135deg, rgba(255,45,149,.12), rgba(0,229,255,.08));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 46px 6vw;
  text-align: center;
  max-width: 1100px;
  margin: 0 auto;
}
.badge {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--magenta);
  color: var(--magenta);
  margin-bottom: 16px;
}

.footer {
  border-top: 1px solid var(--border-soft);
  padding: 30px 6vw;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
}

/* ============================================================
   Auth pages
   ============================================================ */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 34px 28px;
  box-shadow: var(--shadow-glow);
}
.auth-tabs {
  display: flex;
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1;
  text-align: center;
  padding: 9px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
}
.auth-tab.active { background: var(--cyan); color: #04141a; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 16px;
  outline: none;
  transition: border-color .15s ease;
}
.field input:focus { border-color: var(--cyan); }

.form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 13px; color: var(--text-dim); }
.form-row label { display: flex; align-items: center; gap: 6px; }

.auth-msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
.auth-msg.error { color: var(--danger); }
.auth-msg.success { color: var(--success); }

/* ============================================================
   Messenger app shell
   ============================================================ */
.app-shell {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: 100vh;
  overflow: hidden;
}
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset: 0 0 0 auto; width: 86vw; max-width: 340px; z-index: 30; transform: translateX(100%); transition: transform .2s ease; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 25; display: none; }
  .sidebar-backdrop.show { display: block; }
}

.sidebar {
  background: var(--bg-panel);
  border-left: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--border-soft);
}
.sidebar-search { padding: 12px 16px; }
.sidebar-search input {
  width: 100%; padding: 10px 14px; border-radius: 999px;
  border: 1px solid var(--border-soft); background: var(--bg-deep);
  color: var(--text-primary); font-size: 13.5px; outline: none;
}
.sidebar-tabs { display: flex; gap: 4px; padding: 0 12px 10px; }
.sidebar-tab {
  padding: 7px 12px; border-radius: 999px; font-size: 12.5px;
  color: var(--text-dim); border: 1px solid transparent;
}
.sidebar-tab.active { background: var(--bg-elevated); color: var(--cyan); border-color: var(--border-soft); }

.chat-list { flex: 1; overflow-y: auto; }
.chat-item {
  display: flex; gap: 12px; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.02);
  transition: background .1s ease;
}
.chat-item:hover { background: var(--bg-elevated); }
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #04141a; font-size: 15px; flex-shrink: 0;
  position: relative;
}
.avatar.online::after {
  content: "";
  position: absolute; bottom: -1px; left: -1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--success); border: 2px solid var(--bg-panel);
}
.chat-item-body { flex: 1; min-width: 0; }
.chat-item-top { display: flex; justify-content: space-between; font-size: 14px; }
.chat-item-name { font-weight: 600; }
.chat-item-time { color: var(--text-faint); font-size: 11.5px; }
.chat-item-preview {
  color: var(--text-dim); font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.unread-dot {
  min-width: 20px; height: 20px; border-radius: 999px;
  background: var(--cyan); color: #04141a;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

.chat-main { display: flex; flex-direction: column; background: var(--bg-deep); }
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--border-soft);
  background: var(--bg-panel);
}
.chat-header-info h3 { margin: 0; font-size: 15px; }
.chat-header-info span { font-size: 12px; color: var(--text-dim); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border-soft); background: transparent;
  color: var(--text-dim); display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }

.messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.msg-row { display: flex; }
.msg-row.own { justify-content: flex-start; flex-direction: row-reverse; }
.bubble {
  max-width: 62%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.7;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
}
.msg-row.own .bubble {
  background: linear-gradient(135deg, rgba(0,229,255,.18), rgba(0,229,255,.08));
  border-color: rgba(0,229,255,.3);
}
.bubble-meta { display: flex; gap: 6px; margin-top: 4px; font-size: 10.5px; color: var(--text-faint); justify-content: flex-end; }

.composer {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-top: 1px solid var(--border-soft);
  background: var(--bg-panel);
}
.composer input {
  flex: 1; padding: 12px 16px; border-radius: 999px;
  border: 1px solid var(--border-soft); background: var(--bg-deep);
  color: var(--text-primary); font-size: 16px; outline: none;
}
.composer input:focus { border-color: var(--cyan); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--cyan), #00b8d4);
  color: #04141a; font-size: 16px; display: flex; align-items: center; justify-content: center;
}

.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-faint); gap: 10px; text-align: center; padding: 40px;
}
.empty-state .mark { font-size: 42px; opacity: .6; }

.hamburger { display: none; }
@media (max-width: 860px) {
  .hamburger { display: flex; }
}

</style>

<script>
// ============================================================
// Cyber Chat — Supabase client bootstrap
// Loaded via CDN script tag before this file (see HTML files).
// ============================================================

const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.CYBERCHAT_CONFIG;

window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
  },
  realtime: {
    params: { eventsPerSecond: 10 },
  },
});

// ---------- shared auth helpers ----------

// Redirect to /auth.html if not logged in. Call at the top of protected pages.
async function requireAuth() {
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = "auth.html";
    return null;
  }
  return session;
}

// Redirect away from auth page if already logged in.
async function redirectIfLoggedIn() {
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session) window.location.href = "app.html";
}

async function getCurrentProfile() {
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  if (!user) return null;
  const { data, error } = await window.supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();
  if (error) {
    console.error("getCurrentProfile error:", error);
    return null;
  }
  return data;
}

async function signOutCyberChat() {
  await window.supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

// Mark the current user online / update last_seen. Call on load + beforeunload.
async function setPresence(isOnline) {
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  if (!user) return;
  await window.supabaseClient
    .from("profiles")
    .update({ is_online: isOnline, last_seen: new Date().toISOString() })
    .eq("id", user.id);
}

</script>
<script>
// ============================================================
// Cyber Chat — Messenger app logic (Phase 1–3: auth, private chat, realtime)
// Groups / channels / admin panel / media upload land in later phases.
// ============================================================

let me = null;
let activeChatId = null;
let messagesSub = null;

(async function init() {
  const session = await requireAuth();
  if (!session) return;

  me = await getCurrentProfile();
  if (!me) return;

  applyStoredTheme();
  await setPresence(true);
  window.addEventListener("beforeunload", () => setPresence(false));

  await loadChatList();

  document.getElementById("chatSearch").addEventListener("input", (e) => {
    filterChatList(e.target.value.trim());
  });
})();

// ---------- sidebar / mobile ----------
function toggleSidebar(open) {
  document.getElementById("sidebar").classList.toggle("open", open);
  document.getElementById("backdrop").classList.toggle("show", open);
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "light" ? "dark" : "light";
  html.setAttribute("data-theme", next);
  localStorage.setItem("cyberchat_theme", next);
  window.supabaseClient.from("user_settings").update({ theme: next }).eq("user_id", me.id);
}

function applyStoredTheme() {
  const saved = localStorage.getItem("cyberchat_theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
}

// ---------- chat list ----------
let chatCache = [];

async function loadChatList() {
  // all chats I'm a member of, with the other member's profile (private chats only, phase 1)
  const { data: memberships, error } = await window.supabaseClient
    .from("chat_members")
    .select("chat_id, chats(id, type, created_at)")
    .eq("user_id", me.id);

  if (error) { console.error(error); return; }
  if (!memberships || memberships.length === 0) return;

  const chats = [];
  for (const m of memberships) {
    const chat = m.chats;
    if (!chat || chat.type !== "private") continue;

    const { data: others } = await window.supabaseClient
      .from("chat_members")
      .select("profiles(id, username, first_name, last_name, is_online, last_seen)")
      .eq("chat_id", chat.id)
      .neq("user_id", me.id)
      .limit(1);

    const other = others?.[0]?.profiles;
    if (!other) continue;

    const { data: lastMsgArr } = await window.supabaseClient
      .from("messages")
      .select("content, created_at, sender_id, message_type")
      .eq("chat_id", chat.id)
      .order("created_at", { ascending: false })
      .limit(1);

    chats.push({ chatId: chat.id, other, lastMsg: lastMsgArr?.[0] || null });
  }

  chats.sort((a, b) => {
    const ta = a.lastMsg ? new Date(a.lastMsg.created_at) : 0;
    const tb = b.lastMsg ? new Date(b.lastMsg.created_at) : 0;
    return tb - ta;
  });

  chatCache = chats;
  renderChatList(chats);
}

function renderChatList(chats) {
  const list = document.getElementById("chatList");
  if (chats.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="mark">💬</div>هنوز گفتگویی نداری<br>روی ✎ بزن و یک چت جدید بساز</div>`;
    return;
  }
  list.innerHTML = chats.map(c => {
    const name = `${c.other.first_name || ""} ${c.other.last_name || ""}`.trim() || c.other.username;
    const preview = c.lastMsg
      ? (c.lastMsg.message_type === "text" ? c.lastMsg.content : `📎 ${c.lastMsg.message_type}`)
      : "شروع گفتگو...";
    const time = c.lastMsg ? formatTime(c.lastMsg.created_at) : "";
    return `
      <div class="chat-item" onclick="openChat('${c.chatId}')">
        <div class="avatar ${c.other.is_online ? "online" : ""}">${initials(name)}</div>
        <div class="chat-item-body">
          <div class="chat-item-top">
            <span class="chat-item-name">${escapeHtml(name)}</span>
            <span class="chat-item-time">${time}</span>
          </div>
          <div class="chat-item-preview">${escapeHtml(preview || "")}</div>
        </div>
      </div>`;
  }).join("");
}

function filterChatList(query) {
  if (!query) return renderChatList(chatCache);
  const filtered = chatCache.filter(c => {
    const name = `${c.other.first_name || ""} ${c.other.last_name || ""} ${c.other.username}`.toLowerCase();
    return name.includes(query.toLowerCase());
  });
  renderChatList(filtered);
}

// ---------- starting a new chat by username ----------
async function openNewChatPrompt() {
  const username = prompt("نام کاربری طرف مقابل را وارد کن (بدون @):");
  if (!username) return;

  const { data: target, error } = await window.supabaseClient
    .from("profiles")
    .select("id, username, first_name, last_name")
    .ilike("username", username.trim())
    .single();

  if (error || !target) {
    alert("کاربری با این نام کاربری پیدا نشد");
    return;
  }
  if (target.id === me.id) {
    alert("نمی‌تونی با خودت چت بسازی 🙂");
    return;
  }

  // atomic on the database side — avoids RLS timing issues entirely
  const { data: chatId, error: rpcErr } = await window.supabaseClient
    .rpc("create_private_chat", { target_user_id: target.id });

  if (rpcErr) { alert("خطا در ساخت چت: " + rpcErr.message); return; }

  await loadChatList();
  openChat(chatId);
}

// ---------- opening a chat + realtime ----------
let messageCache = {}; // id -> message, for showing reply previews
let replyingTo = null;

async function openChat(chatId) {
  activeChatId = chatId;
  replyingTo = null;
  toggleSidebar(false);

  const chatInfo = chatCache.find(c => c.chatId === chatId);
  const other = chatInfo?.other;
  const name = other ? (`${other.first_name || ""} ${other.last_name || ""}`.trim() || other.username) : "چت";

  const main = document.getElementById("chatMain");
  main.innerHTML = `
    <div class="chat-header">
      <button class="icon-btn hamburger" onclick="toggleSidebar(true)">☰</button>
      <div class="avatar ${other?.is_online ? "online" : ""}">${initials(name)}</div>
      <div class="chat-header-info">
        <h3>${escapeHtml(name)}</h3>
        <span>${other?.is_online ? "آنلاین" : "آخرین بازدید " + (other ? formatTime(other.last_seen) : "")}</span>
      </div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div id="replyPreview" style="display:none; padding:8px 16px; background:var(--bg-elevated); border-top:1px solid var(--border-soft); font-size:12.5px; color:var(--text-dim); display:flex; justify-content:space-between; align-items:center;">
      <span id="replyPreviewText"></span>
      <button class="icon-btn" style="width:26px;height:26px;" onclick="cancelReply()">✕</button>
    </div>
    <div class="composer">
      <button class="icon-btn" onclick="document.getElementById('mediaInput').click()" title="پیوست">📎</button>
      <input type="file" id="mediaInput" style="display:none" onchange="handleMediaUpload(event)">
      <input type="text" id="msgInput" placeholder="پیام خود را بنویس..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  `;

  await loadMessages(chatId);
  subscribeToMessages(chatId);
}

async function loadMessages(chatId) {
  const { data, error } = await window.supabaseClient
    .from("messages")
    .select("*, message_attachments(*)")
    .eq("chat_id", chatId)
    .eq("is_deleted", false)
    .order("created_at", { ascending: true })
    .limit(200); // pagination for older history: future phase

  if (error) { console.error(error); return; }
  data.forEach(m => messageCache[m.id] = m);
  const area = document.getElementById("messagesArea");
  area.innerHTML = data.map(renderMessageBubble).join("");
  area.scrollTop = area.scrollHeight;
}

function renderMessageBubble(msg) {
  const own = msg.sender_id === me.id;
  const replySnippet = msg.reply_to && messageCache[msg.reply_to]
    ? `<div style="border-right:2px solid var(--cyan); padding-right:8px; margin-bottom:6px; font-size:12px; color:var(--text-dim); opacity:.85;">${escapeHtml((messageCache[msg.reply_to].content || "").slice(0, 80))}</div>`
    : "";

  let mediaHtml = "";
  const att = msg.message_attachments?.[0];
  if (att) {
    const url = window.supabaseClient.storage.from(bucketForType(msg.message_type)).getPublicUrl(att.storage_path).data.publicUrl;
    if (msg.message_type === "image") mediaHtml = `<img src="${url}" style="max-width:100%; border-radius:10px; margin-bottom:6px; display:block;">`;
    else if (msg.message_type === "video") mediaHtml = `<video src="${url}" controls style="max-width:100%; border-radius:10px; margin-bottom:6px; display:block;"></video>`;
    else if (msg.message_type === "voice") mediaHtml = `<audio src="${url}" controls style="margin-bottom:6px;"></audio>`;
    else mediaHtml = `<a href="${url}" target="_blank" style="display:block; margin-bottom:6px; color:var(--cyan);">📎 ${escapeHtml(att.file_name || "فایل")}</a>`;
  }

  return `
    <div class="msg-row ${own ? "own" : ""}" data-id="${msg.id}">
      <div class="bubble">
        <div style="display:flex; gap:6px; justify-content:flex-end; margin-bottom:2px;">
          <span onclick='startReply(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="ریپلای">↩</span>
          <span onclick='startForward(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="فوروارد">➦</span>
        </div>
        ${replySnippet}
        ${mediaHtml}
        ${msg.content ? escapeHtml(msg.content) : ""}
        <div class="bubble-meta">${formatTime(msg.created_at)}${own ? " · " + statusIcon(msg.status) : ""}</div>
      </div>
    </div>`;
}

function bucketForType(type) {
  return { image: "chat-images", video: "chat-videos", voice: "chat-voice" }[type] || "chat-files";
}

function statusIcon(status) {
  return { sending: "…", sent: "✓", delivered: "✓✓", read: "✓✓" }[status] || "";
}

function startReply(messageId) {
  replyingTo = messageId;
  const msg = messageCache[messageId];
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyPreviewText").textContent = "ریپلای به: " + (msg?.content || "پیام").slice(0, 60);
  document.getElementById("msgInput").focus();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById("replyPreview").style.display = "none";
}

async function startForward(messageId) {
  const msg = messageCache[messageId];
  if (!msg) return;
  const username = prompt("فوروارد به کدوم یوزرنیم؟");
  if (!username) return;

  const { data: target, error } = await window.supabaseClient
    .from("profiles").select("id").ilike("username", username.trim()).single();
  if (error || !target) { alert("کاربر پیدا نشد"); return; }

  const { data: chatId, error: rpcErr } = await window.supabaseClient
    .rpc("create_private_chat", { target_user_id: target.id });
  if (rpcErr) { alert("خطا: " + rpcErr.message); return; }

  const { error: sendErr } = await window.supabaseClient.from("messages").insert({
    chat_id: chatId, sender_id: me.id, content: msg.content,
    message_type: msg.message_type, forwarded_from: msg.id, status: "sent",
  });
  if (sendErr) alert("خطا در فوروارد: " + sendErr.message);
  else alert("فوروارد شد ✓");
}

function subscribeToMessages(chatId) {
  if (messagesSub) window.supabaseClient.removeChannel(messagesSub);

  messagesSub = window.supabaseClient
    .channel(`messages:${chatId}`)
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: `chat_id=eq.${chatId}` },
      async (payload) => {
        const area = document.getElementById("messagesArea");
        if (!area) return;
        // fetch with attachments joined (realtime payload doesn't include joins)
        const { data: full } = await window.supabaseClient
          .from("messages").select("*, message_attachments(*)").eq("id", payload.new.id).single();
        const msg = full || payload.new;
        messageCache[msg.id] = msg;
        area.insertAdjacentHTML("beforeend", renderMessageBubble(msg));
        area.scrollTop = area.scrollHeight;
      }
    )
    .subscribe();
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const content = input.value.trim();
  if (!content || !activeChatId) return;
  input.value = "";

  const payload = {
    chat_id: activeChatId,
    sender_id: me.id,
    content,
    message_type: "text",
    status: "sent",
  };
  if (replyingTo) payload.reply_to = replyingTo;

  const { error } = await window.supabaseClient.from("messages").insert(payload);
  if (error) alert("ارسال پیام ناموفق بود: " + error.message);
  cancelReply();
}

async function handleMediaUpload(event) {
  const file = event.target.files[0];
  if (!file || !activeChatId) return;

  if (file.size > 25 * 1024 * 1024) {
    alert("حجم فایل نباید بیشتر از ۲۵ مگابایت باشد");
    return;
  }

  let type = "file";
  if (file.type.startsWith("image/")) type = "image";
  else if (file.type.startsWith("video/")) type = "video";
  else if (file.type.startsWith("audio/")) type = "voice";

  const bucket = bucketForType(type);
  const path = `${activeChatId}/${crypto.randomUUID()}-${file.name}`;

  const { error: upErr } = await window.supabaseClient.storage.from(bucket).upload(path, file);
  if (upErr) { alert("خطا در آپلود: " + upErr.message); return; }

  const { data: newMsg, error: msgErr } = await window.supabaseClient
    .from("messages")
    .insert({ chat_id: activeChatId, sender_id: me.id, message_type: type, status: "sent" })
    .select().single();

  if (msgErr) { alert("خطا: " + msgErr.message); return; }

  await window.supabaseClient.from("message_attachments").insert({
    message_id: newMsg.id,
    storage_path: path,
    file_name: file.name,
    file_type: file.type,
    file_size: file.size,
  });

  event.target.value = "";
}

// ---------- utils ----------
function initials(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}
function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
