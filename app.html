<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Cyber Chat — Design tokens
   Palette: deep signal-blue base, cyan/magenta dual accent
   Type: Vazirmatn (Persian UI) + JetBrains Mono (labels/brand)
   Signature: "signal ring" pulse on presence + scanline hero
   ============================================================ */

:root {
  --bg-deep: #0E1621;
  --bg-panel: #17212B;
  --bg-elevated: #1F2C38;
  --border-soft: #232E3C;

  --cyan: #2AABEE;
  --magenta: #229ED9;
  --success: #4DCD5E;
  --danger: #EB5545;

  --own-bubble: #2B5278;
  --other-bubble: #182533;

  --text-primary: #FFFFFF;
  --text-dim: #8A9BA8;
  --text-faint: #6C7883;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;

  --shadow-glow: 0 0 24px rgba(42, 171, 238, 0.18);
}

/* Light mode overrides (Telegram light theme) */
[data-theme="light"] {
  --bg-deep: #FFFFFF;
  --bg-panel: #FFFFFF;
  --bg-elevated: #F4F4F5;
  --border-soft: #E4E4E6;
  --text-primary: #000000;
  --text-dim: #707579;
  --text-faint: #A2ACB4;
  --own-bubble: #EAF4FE;
  --other-bubble: #F4F4F5;
  --shadow-glow: 0 0 24px rgba(42, 171, 238, 0.10);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: "Vazirmatn", -apple-system, sans-serif;
  direction: rtl;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* native-feeling momentum scroll everywhere content scrolls */
.messages-area, .chat-list, .channel-feed, #newChatResults, #groupMemberResults,
#globalSearchOverlay, .story-viewer {
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

/* tactile press feedback, like native buttons */
.chat-item, .icon-btn, .fab, .send-btn, .bottom-nav-item, .btn, .story-avatar-wrap {
  transition: transform .12s ease, background .12s ease, opacity .12s ease;
}
.chat-item:active { background: var(--bg-elevated); }
.icon-btn:active, .fab:active, .send-btn:active, .btn:active { transform: scale(0.93); }
.bottom-nav-item:active, .story-avatar-wrap:active { transform: scale(0.92); opacity: .8; }

/* smoother spring-like easing for the screen-stack slide (list <-> chat) */
.sidebar, .chat-main {
  transition: transform .28s cubic-bezier(0.32, 0.72, 0, 1) !important;
}

/* new message bubbles ease in instead of popping */
@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-row { animation: bubbleIn .18s ease-out; }

@keyframes recPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .4; transform: scale(0.8); }
}

@keyframes reactionPop {
  0% { transform: scale(0.3); opacity: 0; }
  55% { transform: scale(1.35); opacity: 1; }
  75% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
.reaction-pop { display: inline-block; animation: reactionPop .35s cubic-bezier(.34,1.56,.64,1); }


.mono {
  font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.02em;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

::selection { background: var(--cyan); color: #ffffff; }

/* ---------- scrollbar ---------- */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   Landing page
   ============================================================ */

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 6vw;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(12px);
  background: rgba(9, 12, 17, 0.7);
  border-bottom: 1px solid var(--border-soft);
}
[data-theme="light"] .nav { background: rgba(244, 246, 250, 0.8); }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "JetBrains Mono", monospace;
  font-weight: 700;
  font-size: 18px;
}
.brand-mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #ffffff; font-weight: 900;
  box-shadow: var(--shadow-glow);
}

.nav-actions { display: flex; gap: 10px; }

.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  transition: all .15s ease;
}
.btn:hover { border-color: var(--cyan); }
.btn-primary {
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  color: #ffffff;
  border: none;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { border: none; color: var(--text-dim); }
.btn-block { width: 100%; padding: 13px; font-size: 15px; }

.hero {
  position: relative;
  padding: 90px 6vw 60px;
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: -20% -10% auto -10%;
  height: 480px;
  background:
    repeating-linear-gradient(180deg, rgba(0,229,255,.05) 0 1px, transparent 1px 3px);
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-family: "JetBrains Mono", monospace;
  color: var(--cyan);
  font-size: 13px;
  letter-spacing: 0.15em;
  margin-bottom: 18px;
}
.hero h1 {
  font-size: clamp(32px, 6vw, 64px);
  line-height: 1.15;
  margin: 0 0 20px;
  font-weight: 800;
}
.hero h1 .grad {
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p {
  max-width: 560px;
  margin: 0 auto 34px;
  color: var(--text-dim);
  font-size: 17px;
  line-height: 1.8;
}
.hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.section { padding: 70px 6vw; }
.section-title {
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 10px;
}
.section-sub {
  text-align: center;
  color: var(--text-dim);
  margin-bottom: 44px;
  font-size: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px;
  max-width: 1100px;
  margin: 0 auto;
}
.card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 24px;
  transition: border-color .15s ease, transform .15s ease;
}
.card:hover { border-color: var(--cyan); transform: translateY(-2px); }
.card-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,229,255,.1);
  color: var(--cyan);
  margin-bottom: 14px;
  font-size: 18px;
}
.card h3 { margin: 0 0 8px; font-size: 16px; }
.card p { margin: 0; color: var(--text-dim); font-size: 13.5px; line-height: 1.7; }

.premium-band {
  background: linear-gradient(135deg, rgba(255,45,149,.12), rgba(0,229,255,.08));
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 46px 6vw;
  text-align: center;
  max-width: 1100px;
  margin: 0 auto;
}
.badge {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--magenta);
  color: var(--magenta);
  margin-bottom: 16px;
}

.footer {
  border-top: 1px solid var(--border-soft);
  padding: 30px 6vw;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
}

/* ============================================================
   Auth pages
   ============================================================ */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 34px 28px;
  box-shadow: var(--shadow-glow);
}
.auth-tabs {
  display: flex;
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1;
  text-align: center;
  padding: 9px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
}
.auth-tab.active { background: var(--cyan); color: #ffffff; }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 16px;
  outline: none;
  transition: border-color .15s ease;
}
.field input:focus { border-color: var(--cyan); }

.form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 13px; color: var(--text-dim); }
.form-row label { display: flex; align-items: center; gap: 6px; }

.auth-msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
.auth-msg.error { color: var(--danger); }
.auth-msg.success { color: var(--success); }

/* ============================================================
   Messenger app shell
   ============================================================ */
.app-shell {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: 100vh;
  height: 100dvh;
  height: calc(var(--app-height, 100vh));
  overflow: hidden;
}
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  /* Mobile is a screen-stack: list is the home screen, chat is pushed on top. */
  .sidebar { position: fixed; inset: 0; width: 100%; max-width: none; z-index: 20; transform: none; }
  .sidebar.chat-open { transform: translateX(100%); transition: transform .2s ease; }
  .chat-main { position: fixed; inset: 0; z-index: 25; transform: translateX(100%); transition: transform .2s ease; }
  .chat-main.active { transform: translateX(0); }
  .sidebar-backdrop { display: none !important; }
}

@media (min-width: 861px) {
  .bottom-nav { display: none; }
  .fab { bottom: 20px; }
}

.sidebar {
  background: var(--bg-panel);
  border-left: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  position: relative;
}
.fab {
  position: absolute;
  bottom: 74px;
  left: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  color: #fff; font-size: 22px; border: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
  z-index: 10;
}
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  background: rgba(23, 33, 43, 0.86);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-top: 0.5px solid rgba(255,255,255,0.12);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 9;
}
[data-theme="light"] .bottom-nav {
  background: rgba(247, 247, 248, 0.86);
  border-top: 0.5px solid rgba(0,0,0,0.15);
}
.bottom-nav-item {
  flex: 1; background: none; border: none; padding: 7px 0 8px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--text-faint); font-size: 10px; font-family: inherit;
}
.bottom-nav-item.active { color: var(--cyan); }
.chat-list { padding-bottom: 60px; }
.bottom-nav-icon { font-size: 22px; }
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px 4px;
}
.sidebar-title {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.3px;
}
.sidebar-search { padding: 8px 16px 12px; }
.sidebar-search input {
  width: 100%; padding: 10px 14px; border-radius: 999px;
  border: 1px solid var(--border-soft); background: var(--bg-deep);
  color: var(--text-primary); font-size: 16px; outline: none;
}
.sidebar-tabs { display: flex; gap: 4px; padding: 0 12px 10px; }
.sidebar-tab {
  padding: 7px 12px; border-radius: 999px; font-size: 12.5px;
  color: var(--text-dim); border: 1px solid transparent;
}
.sidebar-tab.active { background: var(--bg-elevated); color: var(--cyan); border-color: var(--border-soft); }

.chat-list { flex: 1; overflow-y: auto; }
.chat-row-wrap { position: relative; overflow: hidden; }
.chat-row-actions {
  position: absolute; inset: 0; display: flex; justify-content: flex-end; align-items: stretch;
}
.chat-row-actions button {
  width: 70px; border: none; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
}
.chat-row-actions .mute-btn { background: #ffc107; }
.chat-row-actions .delete-btn { background: var(--danger); }
.chat-item {
  display: flex; gap: 13px; align-items: center;
  padding: 10px 14px;
  transition: transform .15s ease;
  background: var(--bg-panel);
  position: relative; z-index: 1;
}
.chat-item::after {
  content: "";
  position: absolute;
  right: 79px; left: 0; bottom: 0;
  height: 1px;
  background: var(--border-soft);
}
.chat-item:hover { background: var(--bg-elevated); }
.stories-bar { display: flex; gap: 14px; padding: 12px 16px; overflow-x: auto; border-bottom: 1px solid var(--border-soft); }
.story-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; width: 60px; }
.story-ring {
  width: 56px; height: 56px; border-radius: 50%; padding: 2px;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  display: flex; align-items: center; justify-content: center;
}
.story-ring.seen { background: var(--border-soft); }
.story-ring .avatar { width: 100%; height: 100%; border: 2px solid var(--bg-panel); }
.story-label { font-size: 10.5px; color: var(--text-dim); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.story-add-badge {
  position: relative;
}
.story-add-badge::after {
  content: "+"; position: absolute; bottom: -1px; left: -1px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--cyan); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg-panel);
}
.story-viewer {
  position: fixed; inset: 0; z-index: 100; background: #000;
  display: flex; align-items: center; justify-content: center;
}
.story-viewer img, .story-viewer video { max-width: 100%; max-height: 100%; object-fit: contain; }
.story-progress { position: absolute; top: 10px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,.25); border-radius: 2px; overflow: hidden; }
.story-progress-fill { height: 100%; width: 0%; background: #fff; }
.story-close { position: absolute; top: 16px; left: 16px; color: #fff; font-size: 24px; background: none; border: none; z-index: 5; }
.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #ffffff; font-size: 19px; flex-shrink: 0;
  position: relative;
}
.avatar.online::after {
  content: "";
  position: absolute; bottom: -1px; left: -1px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--success); border: 2px solid var(--bg-panel);
}
.chat-item-body { flex: 1; min-width: 0; }
.chat-item-top { display: flex; justify-content: space-between; font-size: 14px; }
.chat-item-name { font-weight: 600; }
.chat-item-time { color: var(--text-faint); font-size: 11.5px; }
.chat-item-preview {
  color: var(--text-dim); font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.unread-dot {
  min-width: 20px; height: 20px; border-radius: 999px;
  background: var(--cyan); color: #ffffff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

.chat-main { display: flex; flex-direction: column; background: var(--bg-deep); }
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--border-soft);
  background: var(--bg-panel);
}
.chat-header-info h3 { margin: 0; font-size: 15px; }
.chat-header-info span { font-size: 12px; color: var(--text-dim); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border-soft); background: transparent;
  color: var(--text-dim); display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }
.attach-btn { border-radius: 50%; flex-shrink: 0; }

.messages-area {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
  background-color: var(--bg-deep);
  background-image:
    radial-gradient(circle at 20% 15%, rgba(42,171,238,0.05) 0%, transparent 45%),
    radial-gradient(circle at 80% 40%, rgba(34,158,217,0.04) 0%, transparent 40%),
    radial-gradient(circle at 30% 75%, rgba(42,171,238,0.04) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(34,158,217,0.05) 0%, transparent 45%);
  background-attachment: local;
}
[data-theme="light"] .messages-area {
  background-image:
    radial-gradient(circle at 20% 15%, rgba(42,171,238,0.06) 0%, transparent 45%),
    radial-gradient(circle at 80% 40%, rgba(34,158,217,0.05) 0%, transparent 40%),
    radial-gradient(circle at 30% 75%, rgba(42,171,238,0.05) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(34,158,217,0.06) 0%, transparent 45%);
}
.msg-row { display: flex; }
.msg-row.own { justify-content: flex-start; flex-direction: row-reverse; }
.bubble {
  max-width: 75%;
  padding: 8px 12px;
  border-radius: 16px 16px 16px 4px;
  font-size: 15px;
  line-height: 1.55;
  background: var(--other-bubble);
  border: none;
  box-shadow: 0 1px 2px rgba(0,0,0,.15);
  position: relative;
}
.bubble::after {
  content: "";
  position: absolute;
  bottom: 0; left: -6px;
  width: 0; height: 0;
  border-style: solid;
  border-width: 0 7px 8px 0;
  border-color: transparent var(--other-bubble) transparent transparent;
}
.msg-row.own .bubble {
  background: var(--own-bubble);
  border-radius: 16px 16px 4px 16px;
  border: none;
}
.msg-row.own .bubble::after {
  left: auto; right: -6px;
  border-width: 0 0 8px 7px;
  border-color: transparent transparent transparent var(--own-bubble);
}
.bubble-meta { display: flex; gap: 6px; margin-top: 3px; font-size: 11px; color: var(--text-faint); justify-content: flex-end; }
.msg-row.own .bubble-meta { color: rgba(255,255,255,.55); }
[data-theme="light"] .msg-row.own .bubble-meta { color: rgba(0,0,0,.4); }

.composer {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-top: 1px solid var(--border-soft);
  background: var(--bg-panel);
}
.composer input {
  flex: 1; padding: 12px 16px; border-radius: 999px;
  border: 1px solid var(--border-soft); background: var(--bg-deep);
  color: var(--text-primary); font-size: 16px; outline: none;
}
.composer input:focus { border-color: var(--cyan); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  color: #ffffff; font-size: 16px; display: flex; align-items: center; justify-content: center;
}

.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-faint); gap: 10px; text-align: center; padding: 40px;
}
.empty-state .mark { font-size: 42px; opacity: .6; }

.hamburger { display: none; }
@media (max-width: 860px) {
  .hamburger { display: flex; }
}

</style>
<link rel="manifest" href="manifest.json">

<body>

<div class="sidebar-backdrop" id="backdrop"></div>

<div id="newChatScreen" style="display:none; position:fixed; inset:0; z-index:40; background:var(--bg-panel); flex-direction:column;">
  <div class="settings-top" style="border-bottom:1px solid var(--border-soft);">
    <button class="icon-btn" onclick="closeNewChatSearch()">→</button>
    <h2 style="margin:0; font-size:16px;">گفتگوی جدید</h2>

<script>
// ============================================================
// Cyber Chat — Supabase client bootstrap
// Loaded via CDN script tag before this file (see HTML files).
// ============================================================

const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.CYBERCHAT_CONFIG;

window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
  },
  realtime: {
    params: { eventsPerSecond: 10 },
  },
});

// ---------- shared auth helpers ----------

// Redirect to /auth.html if not logged in. Call at the top of protected pages.
async function requireAuth() {
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = "auth.html";
    return null;
  }
  return session;
}

// Redirect away from auth page if already logged in.
async function redirectIfLoggedIn() {
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session) window.location.href = "app.html";
}

async function getCurrentProfile() {
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  if (!user) return null;
  const { data, error } = await window.supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();
  if (error) {
    console.error("getCurrentProfile error:", error);
    return null;
  }
  return data;
}

async function signOutCyberChat() {
  await window.supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

// Mark the current user online / update last_seen. Call on load + beforeunload.
async function setPresence(isOnline) {
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  if (!user) return;
  await window.supabaseClient
    .from("profiles")
    .update({ is_online: isOnline, last_seen: new Date().toISOString() })
    .eq("id", user.id);
}

</script>
<script>
// ============================================================
// Cyber Chat — Messenger app logic (Phase 1–3: auth, private chat, realtime)
// Groups / channels / admin panel / media upload land in later phases.
// ============================================================

let me = null;
let presenceInterval = null;

function startPresenceHeartbeat() {
  setPresence(true);
  if (presenceInterval) clearInterval(presenceInterval);
  presenceInterval = setInterval(() => setPresence(true), 25000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    setPresence(false);
    if (presenceInterval) clearInterval(presenceInterval);
  } else if (me) {
    startPresenceHeartbeat();
  }
});
window.addEventListener("pagehide", () => setPresence(false));
window.addEventListener("beforeunload", () => setPresence(false));

// Trust is_online only if the heartbeat is recent — protects against a flag
// that never got cleared (app killed, network dropped, etc).
function isActuallyOnline(profile) {
  if (!profile?.is_online || !profile?.last_seen) return false;
  return (Date.now() - new Date(profile.last_seen).getTime()) < 35000;
}

// ---------- browser notifications for messages in chats you're not currently viewing ----------
let globalMsgSub = null;
function subscribeToAllMessagesForNotifications() {
  if (globalMsgSub) window.supabaseClient.removeChannel(globalMsgSub);

  globalMsgSub = window.supabaseClient
    .channel("global-message-notify")
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages" },
      async (payload) => {
        const msg = payload.new;
        if (msg.sender_id === me.id) return; // don't notify on your own messages

        // if it's for the chat currently open, just refresh unread state elsewhere (no popup needed)
        if (msg.chat_id === activeChatId) return;

        // refresh the badge counts in the background
        loadUnifiedList();

        if (document.hidden && Notification.permission === "granted") {
          const { data: sender } = await window.supabaseClient
            .from("profiles").select("first_name, last_name, username").eq("id", msg.sender_id).single();
          const name = sender ? (`${sender.first_name || ""} ${sender.last_name || ""}`.trim() || sender.username) : "پیام جدید";
          const body = msg.message_type === "text" ? msg.content : `📎 ${msg.message_type}`;
          try {
            if (navigator.serviceWorker?.ready) {
              const reg = await navigator.serviceWorker.ready;
              reg.showNotification(name, { body, icon: "icon-192.png" });
            } else {
              new Notification(name, { body });
            }
          } catch (e) { /* notifications not available — silently skip */ }
        }
      }
    )
    .subscribe();
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) return "unsupported";
  if (Notification.permission === "granted") return "granted";
  return await Notification.requestPermission();
}

let activeChatId = null;
let messagesSub = null;

// Robust mobile viewport height (fixes iOS Safari keyboard/toolbar layout freezes)
function setAppHeight() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-height", h + "px");
}
setAppHeight();
window.addEventListener("resize", setAppHeight);
if (window.visualViewport) window.visualViewport.addEventListener("resize", setAppHeight);

(async function init() {
  const session = await requireAuth();

  me = await getCurrentProfile();

  const miniAvatar = document.getElementById("myMiniAvatar");

  else { miniAvatar.textContent = (me.first_name || me.username || "?").charAt(0).toUpperCase(); }

  applyStoredTheme();
  startPresenceHeartbeat();

  await Promise.all([loadUnifiedList(), loadStoriesBar()]);
  subscribeToAllMessagesForNotifications();

  const params = new URLSearchParams(window.location.search);
  const openId = params.get("open");
  if (openId) openChat(openId);
})();

// ---------- mobile screen-stack: list <-> open chat ----------

// ---------- bottom nav: Chats <-> Contacts ----------
async function showBottomTab(tab) {
  document.getElementById("navChats").classList.toggle("active", tab === "chats");
  document.getElementById("navContacts").classList.toggle("active", tab === "contacts");

  if (tab === "chats") {
    await loadUnifiedList();
  } else {
    await renderContactsList();
  }
}

let groupCache = [];
let channelCache = [];
let unifiedListCache = [];

async function loadUnifiedList() {
  document.getElementById("chatList").innerHTML =
    `<div class="empty-state"><div class="mark">💬</div>در حال بارگذاری...</div>`;

  const [chatsRes, groupsRes, channelsRes] = await Promise.all([
    window.supabaseClient.rpc("get_my_chat_list"),
    window.supabaseClient.rpc("get_my_groups"),
    window.supabaseClient.rpc("get_my_channels"),
  ]);

  const chats = (chatsRes.data || []).map(row => ({
    kind: "chat",
    chatId: row.chat_id,
    is_muted: row.is_muted,
    unreadCount: row.unread_count || 0,
    lastTime: row.last_created_at,
    other: {
      id: row.other_id, username: row.other_username, first_name: row.other_first_name,
      last_name: row.other_last_name, avatar_url: row.other_avatar_url,
      is_online: row.other_is_online, last_seen: row.other_last_seen, is_premium: row.other_is_premium,
    },
    lastMsg: row.last_created_at ? { content: row.last_content, message_type: row.last_message_type, created_at: row.last_created_at } : null,
  }));

  groupCache = (groupsRes.data || []).map(row => ({
    kind: "group",
    chatId: row.chat_id, groupId: row.group_id, name: row.name, avatarUrl: row.avatar_url,
    memberCount: row.member_count, myRole: row.my_role, unreadCount: row.unread_count || 0,
    lastTime: row.last_created_at,
    lastMsg: row.last_created_at ? { content: row.last_content, message_type: row.last_message_type, created_at: row.last_created_at } : null,
  }));

  channelCache = (channelsRes.data || []).map(row => ({
    kind: "channel",
    channelId: row.channel_id, name: row.name, username: row.username, avatarUrl: row.avatar_url,
    subscriberCount: row.subscriber_count, myRole: row.my_role, lastTime: row.last_created_at,
    lastMsg: row.last_created_at ? { content: row.last_content, created_at: row.last_created_at } : null,
  }));

  chatCache = chats; // keep for compatibility with existing open-chat lookups

  unifiedListCache = [...chats, ...groupCache, ...channelCache].sort((a, b) => {
    const ta = a.lastTime ? new Date(a.lastTime) : 0;
    const tb = b.lastTime ? new Date(b.lastTime) : 0;
    return tb - ta;
  });

  renderUnifiedList(unifiedListCache);
}

function renderUnifiedList(items) {
  const list = document.getElementById("chatList");
  const savedRow = `
    <div class="chat-row-wrap">
      <div class="chat-item" onclick="openSavedMessages()">
        <div class="avatar" style="background:linear-gradient(135deg, var(--cyan), var(--magenta));">🔖</div>
        <div class="chat-item-body">
          <div class="chat-item-top"><span class="chat-item-name">پیام‌های ذخیره‌شده</span></div>
          <div class="chat-item-preview">یادداشت‌ها و فایل‌های شخصی خودت</div>
        </div>
      </div>
    </div>`;

  if (items.length === 0) {
    list.innerHTML = savedRow + `<div class="empty-state"><div class="mark">💬</div>هنوز گفتگویی نداری<br>روی ✎ بزن و یک چت جدید بساز</div>`;
    return;
  }

  list.innerHTML = savedRow + items.map(item => {
    if (item.kind === "chat") return renderPrivateChatRow(item);
    if (item.kind === "group") return renderGroupRow(item);
    return renderChannelRow(item);
  }).join("");

  attachChatListSwipe(list);
}

function renderChannelRow(ch) {
  const preview = ch.lastMsg ? ch.lastMsg.content : `${ch.subscriberCount} مشترک`;
  const time = ch.lastMsg ? formatTime(ch.lastMsg.created_at) : "";
  const avatarStyle = ch.avatarUrl ? `style="background-image:url(${ch.avatarUrl})"` : "";
  return `
    <div class="chat-row-wrap">
      <div class="chat-item" onclick="window.location.href='channel.html?id=${ch.channelId}'">
        <div class="avatar" ${avatarStyle}>${ch.avatarUrl ? "" : "📢"}</div>
        <div class="chat-item-body">
          <div class="chat-item-top"><span class="chat-item-name">${escapeHtml(ch.name)}</span><span class="chat-item-time">${time}</span></div>
          <div class="chat-item-preview">${escapeHtml(preview || "")}</div>
        </div>
      </div>
    </div>`;
}

function handleFabClick() {
  const menu = document.getElementById("fabMenu");

function openNewChannelFlow() {
  const name = prompt("نام کانال:");
  if (!name) return;
  const username = prompt("یوزرنیم عمومی کانال (بدون @، انگلیسی):");
  if (!username) return;
  const desc = prompt("توضیحات (اختیاری):") || "";

  window.supabaseClient.rpc("create_channel", { _name: name, _username: username, _description: desc })
    .then(({ data: channelId, error }) => {
      if (error) { alert("خطا: " + error.message); return; }
      window.location.href = `channel.html?id=${channelId}`;
    });
}

function renderGroupRow(g) {
  const preview = g.lastMsg
    ? (g.lastMsg.message_type === "text" ? g.lastMsg.content : `📎 ${g.lastMsg.message_type}`)
    : `${g.memberCount} عضو`;
  const time = g.lastMsg ? formatTime(g.lastMsg.created_at) : "";
  const avatarStyle = g.avatarUrl ? `style="background-image:url(${g.avatarUrl})"` : "";
  return `
    <div class="chat-row-wrap" data-chatid="${g.chatId}">
      <div class="chat-row-actions">

            <span class="chat-item-name">${escapeHtml(g.name)}</span>
            <span class="chat-item-time">${time}</span>

          <div class="chat-item-preview">${escapeHtml(preview || "")}</div>
        </div>
        ${g.unreadCount > 0 ? `<div class="unread-dot">${g.unreadCount > 99 ? "99+" : g.unreadCount}</div>` : ""}

async function leaveGroupFromList(groupId, chatId) {
  if (!confirm("از این گروه خارج بشی؟")) return;
  await window.supabaseClient.from("group_members").delete().eq("group_id", groupId).eq("user_id", me.id);
  await window.supabaseClient.from("chat_members").delete().eq("chat_id", chatId).eq("user_id", me.id);
  await loadUnifiedList();
}

function openGroupChat(chatId, groupId) {
  const g = groupCache.find(x => x.chatId === chatId);
  openChat(chatId, {
    name: g?.name || "گروه",
    icon: g?.avatarUrl ? "" : "👥",
    avatarUrl: g?.avatarUrl,
    headerLink: `group-info.html?id=${groupId}`,

async function renderContactsList() {
  const list = document.getElementById("chatList");
  list.innerHTML = `<div class="empty-state"><div class="mark">👥</div>در حال بارگذاری...</div>`;

  const { data, error } = await window.supabaseClient
    .from("contacts")
    .select("profiles:contact_id(id, username, first_name, last_name, avatar_url, is_online)")
    .eq("owner_id", me.id);

  if (error || !data || data.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="mark">👥</div>هنوز مخاطبی نداری<br>با یوزرنیم یا شماره تلفن یکی رو پیدا کن</div>`;
    return;
  }

  list.innerHTML = data.map(row => {
    const c = row.profiles;
    if (!c) return "";
    const name = `${c.first_name || ""} ${c.last_name || ""}`.trim() || c.username;
    const avatarStyle = c.avatar_url ? `style="background-image:url(${c.avatar_url})"` : "";

          <div class="chat-item-preview">@${escapeHtml(c.username || "")}</div>
        </div>
      </div>`;
  }).join("");
}

async function startChatFromContact(userId) {
  const { data: chatId, error } = await window.supabaseClient
    .rpc("create_private_chat", { target_user_id: userId });
  if (error) { alert("خطا: " + error.message); return; }

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "light" ? "dark" : "light";
  html.setAttribute("data-theme", next);
  localStorage.setItem("cyberchat_theme", next);
  window.supabaseClient.from("user_settings").update({ theme: next }).eq("user_id", me.id);
}

function applyStoredTheme() {
  const saved = localStorage.getItem("cyberchat_theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
}

// ---------- chat list ----------
let chatCache = [];

function renderPrivateChatRow(c) {
  const name = `${c.other.first_name || ""} ${c.other.last_name || ""}`.trim() || c.other.username;
  const preview = c.lastMsg
    ? (c.lastMsg.message_type === "text" ? c.lastMsg.content : `📎 ${c.lastMsg.message_type}`)
    : "شروع گفتگو...";
  const time = c.lastMsg ? formatTime(c.lastMsg.created_at) : "";
  const avatarStyle = c.other.avatar_url ? `style="background-image:url(${c.other.avatar_url})"` : "";
  return `
    <div class="chat-row-wrap" data-chatid="${c.chatId}">
      <div class="chat-row-actions">
        <button class="mute-btn" onclick="event.stopPropagation(); muteChat('${c.chatId}', ${!!c.is_muted})">${c.is_muted ? "🔔" : "🔕"}</button>
        <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${c.chatId}')">🗑️</button>
      </div>

        <div class="chat-item-body">

            <span class="chat-item-time">${time}</span>

function handleChatItemClick(event, chatId, itemEl) {
  const wrap = itemEl.closest(".chat-row-wrap");
  if (wrap.classList.contains("swiped")) {
    itemEl.style.transform = "translateX(0)";
    wrap.classList.remove("swiped");
    return;
  }
  openChat(chatId);
}

function attachChatListSwipe(container) {
  let startX = 0, activeItem = null, activeWrap = null, swiping = false;

  container.addEventListener("touchstart", (e) => {
    const wrap = e.target.closest(".chat-row-wrap");
    if (!wrap || !wrap.dataset.chatid) return;
    activeWrap = wrap;
    activeItem = wrap.querySelector(".chat-item");
    startX = e.touches[0].clientX;
    swiping = true;
  }, { passive: true });

  container.addEventListener("touchmove", (e) => {
    if (!swiping || !activeItem) return;
    const dx = e.touches[0].clientX - startX;
    const base = activeWrap.classList.contains("swiped") ? -140 : 0;
    const val = Math.min(0, Math.max(-140, base + dx));
    activeItem.style.transform = `translateX(${val}px)`;
  }, { passive: true });

  container.addEventListener("touchend", (e) => {
    if (!swiping || !activeItem) return;
    const dx = e.changedTouches[0].clientX - startX;
    const base = activeWrap.classList.contains("swiped") ? -140 : 0;
    const finalVal = base + dx;
    if (finalVal < -70) {
      activeItem.style.transform = "translateX(-140px)";
      activeWrap.classList.add("swiped");
    } else {
      activeItem.style.transform = "translateX(0)";
      activeWrap.classList.remove("swiped");
    }
    swiping = false; activeItem = null; activeWrap = null;
  });
}

async function handleStoryUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const isVideo = file.type.startsWith("video/");
  const maxSize = isVideo ? 45 * 1024 * 1024 : 20 * 1024 * 1024;
  if (file.size > maxSize) {
    alert(`حجم ${isVideo ? "ویدیو" : "عکس"} نباید بیشتر از ${isVideo ? 45 : 20} مگابایت باشد`);
    return;
  }

  const ext = file.name.split(".").pop();
  const path = `${me.id}/${crypto.randomUUID()}.${ext}`;

  const { error: upErr } = await window.supabaseClient.storage.from("stories").upload(path, file);
  if (upErr) { alert("خطا در آپلود: " + upErr.message); return; }

  const { error: dbErr } = await window.supabaseClient.from("stories").insert({
    user_id: me.id, media_path: path, media_type: isVideo ? "video" : "image",
  });
  if (dbErr) { alert("خطا: " + dbErr.message); return; }

  event.target.value = "";
  await loadStoriesBar();
  alert("استوری منتشر شد ✓ (تا ۲۴ ساعت روی پروفایلت می‌مونه)");
}

async function viewStories(userId) {
  const stories = userId === me.id ? window._myStories : window._storiesByUser[userId]?.stories;
  if (!stories || stories.length === 0) return;

  let index = 0;
  let paused = false;
  const viewer = document.createElement("div");
  viewer.className = "story-viewer";
  document.body.appendChild(viewer);

  function render() {
    const s = stories[index];
    const url = window.supabaseClient.storage.from("stories").getPublicUrl(s.media_path).data.publicUrl;
    const isVideo = s.media_type === "video";
    viewer.innerHTML = `
      <div class="story-progress"><div class="story-progress-fill" id="storyProgressFill"></div></div>
      <button class="story-close" onclick="this.closest('.story-viewer').remove()">✕</button>
      ${isVideo
        ? `<video src="${url}" autoplay playsinline muted style="max-width:100%; max-height:100%; object-fit:contain;"></video>`
        : `<img src="${url}">`}
    `;
    window.supabaseClient.from("story_views").upsert(
      { story_id: s.id, viewer_id: me.id }, { onConflict: "story_id,viewer_id" }
    );

    const fill = document.getElementById("storyProgressFill");
    let progress = 0;
    paused = false;
    const interval = setInterval(() => {
      if (paused) return;
      progress += 2;
      if (fill) fill.style.width = progress + "%";
      if (progress >= 100) {
        clearInterval(interval);
        if (index < stories.length - 1) { index++; render(); }
        else viewer.remove();
      }
    }, 100);

    // press and hold to pause (Telegram-style); releasing a real hold should
    // resume, not advance — only a quick tap advances
    let pressStart = 0;
    const pauseOn = () => { paused = true; pressStart = Date.now(); };
    const pauseOff = () => { paused = false; };
    viewer.addEventListener("touchstart", pauseOn);
    viewer.addEventListener("touchend", pauseOff);
    viewer.addEventListener("mousedown", pauseOn);
    viewer.addEventListener("mouseup", pauseOff);

    viewer.onclick = (e) => {
      if (e.target.classList.contains("story-close")) return;
      const heldMs = Date.now() - pressStart;
      if (heldMs > 250) return; // was a hold-and-release, just resume — don't advance
      clearInterval(interval);
      if (index < stories.length - 1) { index++; render(); }
      else viewer.remove();
    };
  }
  render();
}

let globalSearchTimer = null;
function handleGlobalSearchInput() {
  const q = document.getElementById("chatSearch").value.trim();

async function runGlobalSearch(q) {
  const overlay = document.getElementById("globalSearchOverlay");

  const [peopleRes, groupsRes, channelsRes, messagesRes] = await Promise.all([
    window.supabaseClient.from("profiles")
      .select("id, username, first_name, last_name, avatar_url")
      .neq("id", me.id).ilike("username", `%${q}%`).limit(8),
    window.supabaseClient.from("groups")
      .select("id, chat_id, name, avatar_url").ilike("name", `%${q}%`).limit(8),
    window.supabaseClient.from("channels")
      .select("id, name, username, avatar_url").or(`name.ilike.%${q}%,username.ilike.%${q}%`).limit(8),
    window.supabaseClient.from("messages")
      .select("id, chat_id, content, created_at").eq("is_deleted", false)
      .ilike("content", `%${q}%`).order("created_at", { ascending: false }).limit(10),
  ]);

  const sections = [];

  if (peopleRes.data?.length) {
    sections.push(sectionHtml("افراد", peopleRes.data.map(u => {
      const name = `${u.first_name || ""} ${u.last_name || ""}`.trim() || u.username;
      return rowHtml(u.avatar_url, name, "@" + u.username, `startChatFromSearch('${u.id}')`);
    })));
  }
  if (groupsRes.data?.length) {
    sections.push(sectionHtml("گروه‌ها", groupsRes.data.map(g =>
      rowHtml(g.avatar_url, g.name, "گروه", `openGroupChat('${g.chat_id}', '${g.id}')`, "👥")
    )));
  }
  if (channelsRes.data?.length) {
    sections.push(sectionHtml("کانال‌ها", channelsRes.data.map(c =>
      rowHtml(c.avatar_url, c.name, "@" + c.username, `window.location.href='channel.html?id=${c.id}'`, "📢")
    )));
  }
  if (messagesRes.data?.length) {
    sections.push(sectionHtml("پیام‌ها", messagesRes.data.map(m =>
      rowHtml(null, (m.content || "").slice(0, 60), formatTime(m.created_at), `openChat('${m.chat_id}')`, "💬")
    )));
  }

  overlay.innerHTML = sections.length
    ? sections.join("")
    : `<div class="empty-state" style="height:auto; padding-top:40px;"><div class="mark">🔍</div>چیزی پیدا نشد</div>`;
}

  const { data, error } = await window.supabaseClient
    .from("messages")
    .select("*, message_attachments(*), message_reactions(*)")
    .eq("chat_id", chatId)
    .order("created_at", { ascending: true })
    .limit(200); // pagination for older history: future phase

  if (error) { console.error(error); return; }
  data.forEach(m => messageCache[m.id] = m);
  const area = document.getElementById("messagesArea");
  area.innerHTML = data.map(renderMessageBubble).join("");
  area.scrollTop = area.scrollHeight;
  renderPinnedBanner();
}

function renderMessageBubble(msg) {
  const own = msg.sender_id === me.id;
  const replySnippet = msg.reply_to && messageCache[msg.reply_to]
    ? `<div style="border-right:2px solid var(--cyan); padding-right:8px; margin-bottom:6px; font-size:12px; color:var(--text-dim); opacity:.85;">${escapeHtml((messageCache[msg.reply_to].content || "").slice(0, 80))}</div>`
    : "";

  if (msg.is_deleted) {
    return `
      <div class="msg-row ${own ? "own" : ""}" data-id="${msg.id}">
        <div class="bubble" style="opacity:.6; font-style:italic;">
          این پیام حذف شده
          <div class="bubble-meta">${formatTime(msg.created_at)}</div>
        </div>
      </div>`;
  }

  let mediaHtml = "";
  const att = msg.message_attachments?.[0];
  if (att) {
    const url = window.supabaseClient.storage.from(bucketForType(msg.message_type)).getPublicUrl(att.storage_path).data.publicUrl;
    if (msg.message_type === "image") mediaHtml = `<img src="${url}" style="max-width:100%; border-radius:10px; margin-bottom:6px; display:block;">`;
    else if (msg.message_type === "video") mediaHtml = `<video src="${url}" controls style="max-width:100%; border-radius:10px; margin-bottom:6px; display:block;"></video>`;
    else if (msg.message_type === "voice") mediaHtml = `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; min-width:220px;">
        <div style="width:34px; height:34px; border-radius:50%; background:var(--cyan); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;">🎵</div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(att.file_name || "فایل صوتی")}</div>
          <audio src="${url}" controls style="width:100%; height:32px; margin-top:2px;"></audio>
        </div>
      </div>`;
    else mediaHtml = `<a href="${url}" target="_blank" style="display:block; margin-bottom:6px; color:var(--cyan);">📎 ${escapeHtml(att.file_name || "فایل")}</a>`;
  }

  const reactions = msg.message_reactions || [];
  const reactionCounts = {};
  reactions.forEach(r => { reactionCounts[r.emoji] = (reactionCounts[r.emoji] || 0) + 1; });
  const myReaction = reactions.find(r => r.user_id === me.id)?.emoji;
  const reactionsHtml = Object.keys(reactionCounts).length
    ? `<div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:5px;">${Object.entries(reactionCounts).map(([emoji, count]) => `
        <span onclick='toggleReaction(${JSON.stringify(msg.id)}, ${JSON.stringify(emoji)})' class="${emoji === myReaction ? "reaction-pop" : ""}" style="cursor:pointer; font-size:12px; padding:2px 7px; border-radius:999px; background:${emoji === myReaction ? "var(--cyan)" : "var(--bg-elevated)"}; ${emoji === myReaction ? "color:#fff;" : ""}">${emoji} ${count}</span>
      `).join("")}</div>`
    : "";

  return `
    <div class="msg-row ${own ? "own" : ""}" data-id="${msg.id}">
      <div class="bubble">
        <div style="display:flex; gap:6px; justify-content:flex-end; margin-bottom:2px; flex-wrap:wrap;">
          <span onclick='openReactionPicker(event, ${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="ری‌اکشن">😀</span>
          <span onclick='startReply(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="ریپلای">↩</span>
          <span onclick='startForward(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="فوروارد">➦</span>
          <span onclick='togglePinMessage(${JSON.stringify(msg.id)}, ${!!msg.is_pinned})' style="cursor:pointer; font-size:11px; color:${msg.is_pinned ? "var(--cyan)" : "var(--text-faint)"};" title="پین">📌</span>
          ${own ? `<span onclick='startEditMessage(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="ویرایش">✏️</span>
                   <span onclick='deleteMessage(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="حذف">🗑</span>`
              : `<span onclick='reportMessage(${JSON.stringify(msg.id)})' style="cursor:pointer; font-size:11px; color:var(--text-faint);" title="گزارش">🚩</span>`}
        </div>
        ${replySnippet}
        ${mediaHtml}
        <span id="msg-content-${msg.id}">${msg.content ? escapeHtml(msg.content) : ""}</span>
        ${reactionsHtml}
        <div class="bubble-meta">${msg.is_edited ? "ویرایش‌شده · " : ""}${formatTime(msg.created_at)}${own ? " · " + statusIcon(msg.status) : ""}</div>
      </div>
    </div>`;
}

const QUICK_REACTIONS = ["❤️", "👍", "😂", "😮", "😢", "🔥"];
function openReactionPicker(event, messageId) {
  event.stopPropagation();
  document.querySelectorAll(".reaction-picker").forEach(el => el.remove());
  const picker = document.createElement("div");
  picker.className = "reaction-picker";
  picker.style.cssText = "position:absolute; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:20px; padding:6px 10px; display:flex; gap:6px; z-index:50; box-shadow:0 4px 14px rgba(0,0,0,.3);";
  picker.innerHTML = QUICK_REACTIONS.map(e =>
    `<span style="cursor:pointer; font-size:18px;" onclick='toggleReaction(${JSON.stringify(messageId)}, ${JSON.stringify(e)}); this.parentElement.remove();'>${e}</span>`
  ).join("");
  document.body.appendChild(picker);
  const rect = event.target.getBoundingClientRect();
  picker.style.top = (rect.top - 44) + "px";
  picker.style.left = Math.max(8, rect.left - 100) + "px";
  setTimeout(() => document.addEventListener("click", function closeOnce() {
    picker.remove(); document.removeEventListener("click", closeOnce);
  }), 10);
}

async function toggleReaction(messageId, emoji) {
  const msg = messageCache[messageId];
  const existing = msg?.message_reactions?.find(r => r.user_id === me.id);

  if (existing && existing.emoji === emoji) {
    await window.supabaseClient.from("message_reactions").delete()
      .eq("message_id", messageId).eq("user_id", me.id).eq("emoji", emoji);
  } else {
    if (existing) {
      await window.supabaseClient.from("message_reactions").delete()
        .eq("message_id", messageId).eq("user_id", me.id);
    }
    await window.supabaseClient.from("message_reactions").insert({
      message_id: messageId, user_id: me.id, emoji,
    });
  }
  const { data: full } = await window.supabaseClient
    .from("messages").select("*, message_attachments(*), message_reactions(*)").eq("id", messageId).single();
  if (full) {
    messageCache[messageId] = full;
    const row = document.querySelector(`[data-id="${messageId}"]`);
    if (row) row.outerHTML = renderMessageBubble(full);
  }
}

function startEditMessage(messageId) {
  const msg = messageCache[messageId];
  if (!msg) return;
  const input = document.getElementById("msgInput");
  input.value = msg.content || "";
  input.focus();
  editingMessageId = messageId;
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyPreviewText").textContent = "در حال ویرایش پیام";
  updateSendButtonMode();
}

async function deleteMessage(messageId) {
  if (!confirm("این پیام برای همه حذف بشه؟")) return;
  const { error } = await window.supabaseClient
    .from("messages").update({ is_deleted: true, content: null }).eq("id", messageId);
  if (error) { alert("خطا: " + error.message); return; }
  const row = document.querySelector(`[data-id="${messageId}"]`);
  if (row && messageCache[messageId]) {
    messageCache[messageId].is_deleted = true;
    row.outerHTML = renderMessageBubble(messageCache[messageId]);
  }
}

async function togglePinMessage(messageId, currentlyPinned) {
  const { error } = await window.supabaseClient
    .from("messages").update({ is_pinned: !currentlyPinned }).eq("id", messageId);
  if (error) { alert("خطا: " + error.message); return; }
  if (messageCache[messageId]) messageCache[messageId].is_pinned = !currentlyPinned;
  renderPinnedBanner();
  const row = document.querySelector(`[data-id="${messageId}"]`);
  if (row) row.outerHTML = renderMessageBubble(messageCache[messageId]);
}

function renderPinnedBanner() {
  const pinned = Object.values(messageCache).filter(m => m.is_pinned && m.chat_id === activeChatId);
  const banner = document.getElementById("pinnedBanner");
  if (!banner) return;
  if (pinned.length === 0) { banner.style.display = "none"; return; }
  const latest = pinned[pinned.length - 1];
  banner.style.display = "flex";
  banner.querySelector(".pinned-text").textContent = "📌 " + (latest.content || "پیام پین‌شده").slice(0, 60);
}

function bucketForType(type) {
  return { image: "chat-images", video: "chat-videos", voice: "chat-voice" }[type] || "chat-files";
}

function statusIcon(status) {
  return { sending: "…", sent: "✓", delivered: "✓✓", read: "✓✓" }[status] || "";
}

// ---------- swipe-left-to-reply (Telegram-style gesture) ----------
function attachSwipeHandlers(container) {
  if (!container) return;
  let startX = 0, activeBubble = null, activeRow = null, swiping = false;

  container.addEventListener("touchstart", (e) => {
    const row = e.target.closest(".msg-row");
    if (!row) return;
    activeRow = row;
    activeBubble = row.querySelector(".bubble");
    startX = e.touches[0].clientX;
    swiping = true;
  }, { passive: true });

  container.addEventListener("touchmove", (e) => {
    if (!swiping || !activeBubble) return;
    const dx = e.touches[0].clientX - startX;
    if (dx < 0) activeBubble.style.transform = `translateX(${Math.max(dx, -60)}px)`;
  }, { passive: true });

  container.addEventListener("touchend", (e) => {
    if (!swiping || !activeBubble) return;
    const dx = e.changedTouches[0].clientX - startX;
    activeBubble.style.transition = "transform .15s ease";
    activeBubble.style.transform = "translateX(0)";
    setTimeout(() => { if (activeBubble) activeBubble.style.transition = ""; }, 200);
    if (dx < -45) startReply(activeRow.dataset.id);
    swiping = false; activeBubble = null; activeRow = null;
  });
}

function startReply(messageId) {
  replyingTo = messageId;
  const msg = messageCache[messageId];
  document.getElementById("replyPreview").style.display = "flex";
  document.getElementById("replyPreviewText").textContent = "ریپلای به: " + (msg?.content || "پیام").slice(0, 60);
  document.getElementById("msgInput").focus();
}

function cancelReply() {
  replyingTo = null;
  const wasEditing = editingMessageId;
  editingMessageId = null;
  document.getElementById("replyPreview").style.display = "none";
  if (wasEditing) { document.getElementById("msgInput").value = ""; updateSendButtonMode(); }
}

async function startForward(messageId) {
  const msg = messageCache[messageId];
  if (!msg) return;
  const username = prompt("فوروارد به کدوم یوزرنیم؟");
  if (!username) return;

  const { data: target, error } = await window.supabaseClient
    .from("profiles").select("id").ilike("username", username.trim()).single();
  if (error || !target) { alert("کاربر پیدا نشد"); return; }

  const { data: chatId, error: rpcErr } = await window.supabaseClient
    .rpc("create_private_chat", { target_user_id: target.id });
  if (rpcErr) { alert("خطا: " + rpcErr.message); return; }

  const { error: sendErr } = await window.supabaseClient.from("messages").insert({
    chat_id: chatId, sender_id: me.id, content: msg.content,
    message_type: msg.message_type, forwarded_from: msg.id, status: "sent",
  });
  if (sendErr) alert("خطا در فوروارد: " + sendErr.message);
  else alert("فوروارد شد ✓");
}

async function reportMessage(messageId) {
  const reason = prompt("دلیل گزارش این پیام رو بنویس:");
  if (!reason) return;
  const { error } = await window.supabaseClient.from("reports").insert({
    reporter_id: me.id, target_type: "message", target_id: messageId, reason,
  });
  if (error) alert("خطا: " + error.message);
  else alert("پیام گزارش شد ✓");
}

function subscribeToMessages(chatId) {
  if (messagesSub) window.supabaseClient.removeChannel(messagesSub);

  messagesSub = window.supabaseClient
    .channel(`messages:${chatId}`)
    .on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages", filter: `chat_id=eq.${chatId}` },
      async (payload) => {
        const area = document.getElementById("messagesArea");
        if (!area) return;
        // already rendered optimistically by sendMessage() on this device — skip re-render
        if (document.querySelector(`[data-id="${payload.new.id}"]`)) {
          const { data: full } = await window.supabaseClient
            .from("messages").select("*, message_attachments(*), message_reactions(*)").eq("id", payload.new.id).single();
          if (full) messageCache[full.id] = full;
          return;
        }
        // fetch with attachments joined (realtime payload doesn't include joins)
        const { data: full } = await window.supabaseClient
          .from("messages").select("*, message_attachments(*), message_reactions(*)").eq("id", payload.new.id).single();
        const msg = full || payload.new;
        messageCache[msg.id] = msg;
        area.insertAdjacentHTML("beforeend", renderMessageBubble(msg));
        area.scrollTop = area.scrollHeight;
      }
    )
    .on("postgres_changes",
      { event: "UPDATE", schema: "public", table: "messages", filter: `chat_id=eq.${chatId}` },
      async (payload) => {
        const { data: full } = await window.supabaseClient
          .from("messages").select("*, message_attachments(*), message_reactions(*)").eq("id", payload.new.id).single();
        const msg = full || payload.new;
        messageCache[msg.id] = msg;
        const row = document.querySelector(`[data-id="${msg.id}"]`);
        if (row) row.outerHTML = renderMessageBubble(msg);
        renderPinnedBanner();
      }
    )
    .on("postgres_changes",
      { event: "*", schema: "public", table: "message_reactions" },
      async (payload) => {
        const msgId = payload.new?.message_id || payload.old?.message_id;
        if (!msgId || !messageCache[msgId]) return;
        const { data: full } = await window.supabaseClient
          .from("messages").select("*, message_attachments(*), message_reactions(*)").eq("id", msgId).single();
        if (!full) return;
        messageCache[msgId] = full;
        const row = document.querySelector(`[data-id="${msgId}"]`);
        if (row) row.outerHTML = renderMessageBubble(full);
      }
    )
    .subscribe();
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const content = input.value.trim();
  if (!content || !activeChatId) return;

  if (editingMessageId) {
    const idToEdit = editingMessageId;
    input.value = "";
    cancelReply();
    const { error } = await window.supabaseClient
      .from("messages").update({ content, is_edited: true }).eq("id", idToEdit);
    if (error) { alert("خطا در ویرایش: " + error.message); return; }
    if (messageCache[idToEdit]) {
      messageCache[idToEdit].content = content;
      messageCache[idToEdit].is_edited = true;
      const row = document.querySelector(`[data-id="${idToEdit}"]`);
      if (row) row.outerHTML = renderMessageBubble(messageCache[idToEdit]);
    }
    return;
  }

  input.value = "";
  updateSendButtonMode();

  // render immediately (optimistic) instead of waiting for the realtime echo,
  // which can lag a few seconds — we generate the id ourselves so the
  // realtime INSERT event for this same row is recognized and skipped.
  const tempId = crypto.randomUUID();
  const optimisticMsg = {
    id: tempId, chat_id: activeChatId, sender_id: me.id, content,
    message_type: "text", status: "sending", created_at: new Date().toISOString(),
  };
  messageCache[tempId] = optimisticMsg;
  const area = document.getElementById("messagesArea");
  if (area) {
    area.insertAdjacentHTML("beforeend", renderMessageBubble(optimisticMsg));
    area.scrollTop = area.scrollHeight;
  }

  const payload = {
    id: tempId,
    chat_id: activeChatId,
    sender_id: me.id,
    content,
    message_type: "text",
    status: "sent",
  };
  if (replyingTo) payload.reply_to = replyingTo;
  const usedReply = replyingTo;
  cancelReply();

  const { error } = await window.supabaseClient.from("messages").insert(payload);

  if (error) {
    alert("ارسال پیام ناموفق بود: " + error.message);
    const row = document.querySelector(`[data-id="${tempId}"]`);
    if (row) row.remove();
    delete messageCache[tempId];
    return;
  }

  const row = document.querySelector(`[data-id="${tempId}"]`);
  if (row) {
    const meta = row.querySelector(".bubble-meta");
    if (meta) meta.textContent = formatTime(optimisticMsg.created_at) + " · ✓";
  }
}

// ---------- voice recording ----------
let mediaRecorder = null;
let recordedChunks = [];
let recordingStartTime = null;
let recordingTimerInterval = null;

function updateSendButtonMode() {
  const hasText = document.getElementById("msgInput").value.trim().length > 0;
  const btn = document.getElementById("sendBtn");
  if (!btn) return;
  btn.textContent = hasText ? "➤" : "🎤";
  btn.onclick = hasText ? sendMessage : startRecording;
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start();

    recordingStartTime = Date.now();
    document.querySelector(".composer").style.display = "none";
    document.getElementById("recordingBar").style.display = "flex";
    recordingTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordingStartTime) / 1000);
      const mm = String(Math.floor(secs / 60)).padStart(2, "0");
      const ss = String(secs % 60).padStart(2, "0");
      document.getElementById("recordingTimer").textContent = `${mm}:${ss}`;
    }, 250);
  } catch (err) {
    alert("دسترسی به میکروفون ممکن نشد: " + err.message);
  }
}

function stopRecordingInternal() {
  clearInterval(recordingTimerInterval);
  document.getElementById("recordingBar").style.display = "none";
  document.querySelector(".composer").style.display = "flex";
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
}

function cancelRecording() {
  if (mediaRecorder) {
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  stopRecordingInternal();
}

async function stopAndSendRecording() {
  if (!mediaRecorder) return;
  mediaRecorder.onstop = async () => {
    stopRecordingInternal();
    const blob = new Blob(recordedChunks, { type: "audio/webm" });
    if (blob.size < 500) return; // too short, ignore accidental taps
    await uploadVoiceBlob(blob);
  };
  mediaRecorder.stop();
}

async function uploadVoiceBlob(blob) {
  if (!activeChatId) return;
  const path = `${activeChatId}/${crypto.randomUUID()}.webm`;

  const { error: upErr } = await window.supabaseClient.storage.from("chat-voice").upload(path, blob, {
    contentType: "audio/webm",
  });
  if (upErr) { alert("خطا در آپلود ویس: " + upErr.message); return; }

  const { data: newMsg, error: msgErr } = await window.supabaseClient
    .from("messages")
    .insert({ chat_id: activeChatId, sender_id: me.id, message_type: "voice", status: "sent" })
    .select().single();
  if (msgErr) { alert("خطا: " + msgErr.message); return; }

  await window.supabaseClient.from("message_attachments").insert({
    message_id: newMsg.id, storage_path: path, file_name: "ویس", file_type: "audio/webm",
  });
}

async function handleMediaUpload(event) {
  const file = event.target.files[0];
  if (!file || !activeChatId) return;

  if (file.size > 45 * 1024 * 1024) {
    alert("حجم فایل نباید بیشتر از ۴۵ مگابایت باشد (سقف واقعی پلن رایگان Supabase، ۵۰ مگابایته)");
    return;
  }

  let type = "file";
  if (file.type.startsWith("image/")) type = "image";
  else if (file.type.startsWith("video/")) type = "video";
  else if (file.type.startsWith("audio/")) type = "voice";

  const bucket = bucketForType(type);
  const path = `${activeChatId}/${crypto.randomUUID()}-${file.name}`;

  const { error: upErr } = await window.supabaseClient.storage.from(bucket).upload(path, file);
  if (upErr) { alert("خطا در آپلود: " + upErr.message); return; }

  const { data: newMsg, error: msgErr } = await window.supabaseClient
    .from("messages")
    .insert({ chat_id: activeChatId, sender_id: me.id, message_type: type, status: "sent" })
    .select().single();

  if (msgErr) { alert("خطا: " + msgErr.message); return; }

  await window.supabaseClient.from("message_attachments").insert({
    message_id: newMsg.id,
    storage_path: path,
    file_name: file.name,
    file_type: file.type,
    file_size: file.size,
  });

  event.target.value = "";
}

// ---------- utils ----------
function initials(name) {
  return (name || "?").trim().charAt(0).toUpperCase();
}
function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
